function liuqin(meWx, zhiWx) {
  if (meWx === zhiWx) return "兄弟";
  const sheng = {木:"水",火:"木",土:"火",金:"土",水:"金"};
  const ke = {木:"金",火:"水",土:"木",金:"火",水:"土"};
  const woSheng = {水:"木",木:"火",火:"土",土:"金",金:"水"};
  if (sheng[meWx] === zhiWx) return "父母";
  if (ke[meWx] === zhiWx) return "官鬼";
  if (woSheng[meWx] === zhiWx) return "子孫";
  return "妻財";
}
function najiaZhi(lowerTri, upperTri) {
  return [...NAJIA[lowerTri].l, ...NAJIA[upperTri].u];
}
function getBazi() {
  try {
    if (typeof Solar === "undefined") return null;
    const s = Solar.fromDate(new Date());
    const l = s.getLunar();
    return {
      y: l.getYearInGanZhi(),
      m: l.getMonthInGanZhi(),
      d: l.getDayInGanZhi(),
      h: l.getTimeInGanZhi()
    };
  } catch(e) { return null; }
}

function suggest(q) {
  const lk = ["該不該","要不要","是不是","會不會","還是","選","可不可以","有沒有","能不能","好不好","對不對","值不值"];
  const yk = ["會怎樣","怎麼樣","最後","結果","成不成","發展","走向","未來會","能不能成","後來","結局","下場"];
  if (lk.some(k => q.includes(k))) return "lenormand";
  if (yk.some(k => q.includes(k))) return "liuyao";
  return "tarot";
}
function shuf(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function drawT(n) { return shuf(ALL_TAROT).slice(0, n).map(c => ({ name: c, rev: Math.random() < 0.5 })); }
function drawL(n) { return shuf(LENORMAND).slice(0, n).map(c => ({ name: c })); }
function tossYao() {
  const c = [Math.random() < 0.5 ? "正" : "反", Math.random() < 0.5 ? "正" : "反", Math.random() < 0.5 ? "正" : "反"];
  const h = c.filter(x => x === "正").length;
  if (h === 3) return { c, v: 9, t: "老陽（動）", l: 1, m: true };
  if (h === 2) return { c, v: 8, t: "少陰", l: 0, m: false };
  if (h === 1) return { c, v: 7, t: "少陽", l: 1, m: false };
  return { c, v: 6, t: "老陰（動）", l: 0, m: true };
}
function getTri(l) { for (const [n, p] of Object.entries(BAGUA_LINES)) if (p[0] === l[0] && p[1] === l[1] && p[2] === l[2]) return n; return ""; }

function compHex(yaos) {
  const ls = yaos.map(y => y.l);
  const ch = yaos.map(y => y.v === 9 ? 0 : y.v === 6 ? 1 : y.l);
  const lo = getTri(ls.slice(0, 3)), up = getTri(ls.slice(3, 6));
  const lc = getTri(ch.slice(0, 3)), uc = getTri(ch.slice(3, 6));
  const on = HEX_T[lo + up] || "?", cn = HEX_T[lc + uc] || "?";
  const mv = yaos.map((y, i) => y.m ? i : -1).filter(i => i >= 0);

  const oZhi = najiaZhi(lo, up);
  const cZhi = najiaZhi(lc, uc);
  const pal  = PALACE[on] || null;
  const palWx = pal ? TRI_WX[pal.p] : null;
  const bazi = getBazi();
  const dayGan = bazi ? bazi.d[0] : null;
  const shen = dayGan && LIUSHEN[dayGan] ? LIUSHEN[dayGan] : null;

  const lines = yaos.map((y, i) => {
    const z = oZhi[i];
    const zwx = ZHI_WX[z];
    const lq = palWx ? liuqin(palWx, zwx) : null;
    const sh = shen ? shen[i] : null;
    const role = pal ? (pal.s === i+1 ? "世" : pal.r === i+1 ? "應" : "") : "";
    let cZ = null, cLq = null;
    if (y.m) {
      cZ = cZhi[i];
      const cWx = ZHI_WX[cZ];
      cLq = palWx ? liuqin(palWx, cWx) : null;
    }
    return { z, zwx, lq, sh, role, cZ, cLq };
  });

  return { o: on, oN: HEX_N[on] || 0, c: cn, cN: HEX_N[cn] || 0, mv, hasM: mv.length > 0,
           palace: pal ? pal.p : null, palaceWx: palWx, bazi, lines };
}

/* ═══ CARD DRAW ═══ */
function PageC({ system, cnt, question, onResult, onBack }) {
  const [cards, setCards] = useState([]);
  const [rev, setRev] = useState([]);
  const [done, setDone] = useState(false);
  const started = useRef(false);
  const tmr = useRef(null);

  useEffect(() => {
    if (started.current) return;
    started.current = true;
    const drawn = system === "tarot" ? drawT(cnt) : drawL(cnt);
    setCards(drawn);
    let idx = 0;
    function next() {
      if (idx >= drawn.length) { setDone(true); return; }
      const ci = idx;
      setRev(p => [...p, ci]);
      idx++;
      tmr.current = setTimeout(next, 1000);
    }
    tmr.current = setTimeout(next, 1000);
    return () => { if (tmr.current) clearTimeout(tmr.current); };
  }, []);

  function fmt() {
    const sn = system === "tarot" ? "塔羅" : "雷諾曼";
    const cs = cards.map(c => system === "tarot" ? `${c.rev ? "逆位" : "正位"}${c.name}` : c.name);
    return `【${sn}${cnt}張牌結果】\n占問：${question}\n\n牌面：${cs.join("、")}`;
  }

  const cw = cnt <= 3 ? 98 : 72;
  const ch = cnt <= 3 ? 152 : 110;
  const is5 = cnt === 5;
  const row1 = is5 ? cards.slice(0, 3) : cards;
  const row2 = is5 ? cards.slice(3, 5) : [];

  function renderCard(c, i, globalIndex) {
    const show = rev.includes(globalIndex);
    return (
      <div key={i} style={{ width:cw, height:ch, perspective:600, flexShrink:0,
        transform: show ? 'translateY(-4px)' : 'translateY(0)',
        transition: 'transform 0.4s ease'
      }}>
        <div style={{
          width:"100%", height:"100%", position:"relative",
          transformStyle:"preserve-3d",
          transition:"transform 0.65s cubic-bezier(0.4,0,0.2,1)",
          transform: show ? "rotateY(180deg)" : "rotateY(0deg)",
        }}>
          <div style={{ position:"absolute", width:"100%", height:"100%", backfaceVisibility:"hidden", WebkitBackfaceVisibility:"hidden", borderRadius:10, background:"linear-gradient(155deg,#6b8f71,#4a6b4e)", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 2px 8px rgba(0,0,0,0.1)" }}>
            <div style={{ width:"68%", height:"78%", border:"1px solid rgba(255,255,255,0.15)", borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ fontSize:cnt<=3?14:10, color:"rgba(255,255,255,0.2)" }}>✦</span>
            </div>
          </div>
          <div style={{ position:"absolute", width:"100%", height:"100%", backfaceVisibility:"hidden", WebkitBackfaceVisibility:"hidden", transform:"rotateY(180deg)", borderRadius:10, background:"#fff", border:"1px solid #ddd9d2", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:cnt<=3?10:6, boxShadow:"0 3px 14px rgba(0,0,0,0.08)" }}>
            {c && (<>
              {system === "tarot" && (
                <div style={{ position:"absolute", top:cnt<=3?7:4, fontSize:cnt<=3?9:7, letterSpacing:2, color:c.rev?"#c07070":"#6b8f71", fontWeight:500 }}>
                  {c.rev ? "逆位" : "正位"}
                </div>
              )}
              <div style={{ fontSize:cnt<=3?14:10, fontWeight:500, color:"#2c2c2c", letterSpacing:cnt<=3?2:1, textAlign:"center", lineHeight:1.6, transform:system==="tarot"&&c.rev?"rotate(180deg)":"none" }}>
                {c.name}
              </div>
              {system === "tarot" && TAROT_MAJOR.includes(c.name) && (
                <div style={{ position:"absolute", bottom:cnt<=3?7:4, fontSize:cnt<=3?8:6, color:"#b8956a", letterSpacing:1 }}>大秘儀</div>
              )}
            </>)}
          </div>
        </div>
      </div>
    );
  }

  return (
    <Wrap><BkBtn onClick={onBack} />
      <div style={{ padding:"76px 20px 40px", animation:"fu 0.6s ease" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <h1 className="it" style={{ fontSize:24, fontWeight:300, fontStyle:"italic", letterSpacing:2 }}>
            {system === "tarot" ? "Tarocchi" : "Lenormand"}
          </h1>
          <div style={{ fontSize:11, color:"#aaa", marginTop:8, letterSpacing:2 }}>
            {rev.length < cnt ? `${rev.length} / ${cnt}` : "牌面已開"}
          </div>
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:10, marginBottom:32 }}>
          <div style={{ display:"flex", gap:cnt<=3?10:7, justifyContent:"center" }}>
            {row1.map((c, i) => renderCard(c, i, i))}
          </div>
          {is5 && (
            <div style={{ display:"flex", gap:7, justifyContent:"center" }}>
              {row2.map((c, i) => renderCard(c, i, i + 3))}
            </div>
          )}
        </div>
        {done && <div style={{ animation:"slideUp 0.5s ease", padding:"0 4px" }}><PBtn onClick={() => onResult({ text: fmt(), system })}>Risultato</PBtn></div>}
      </div></Wrap>
  );
}

/* ═══ LIU YAO ═══ */
function PageY({ question, onResult, onBack }) {
  const [yaos, setYaos] = useState([]);
  const [busy, setBusy] = useState(false);
  const [cur, setCur] = useState(0);
  const [hex, setHex] = useState(null);
  const [spin, setSpin] = useState(false);

  function doOne() {
    if (cur >= 6 || busy) return;
    setBusy(true); setSpin(true);
    setTimeout(() => {
      setSpin(false);
      const y = tossYao();
      const ny = [...yaos, y];
      setYaos(ny); setCur(p => p + 1); setBusy(false);
      if (ny.length === 6) setHex(compHex(ny));
    }, 700);
  }
  function doAll() {
    if (busy) return;
    setBusy(true);
    const all = []; let i = 0;
    function next() {
      if (i >= 6) { setBusy(false); setSpin(false); setHex(compHex(all)); return; }
      setSpin(true);
      setTimeout(() => {
        all.push(tossYao());
        setYaos([...all]); setCur(all.length);
        setSpin(false); i++;
        setTimeout(next, 250);
      }, 500);
    }
    next();
  }
  function reset() { setYaos([]); setCur(0); setHex(null); }

  function fmt() {
    const ms = hex.mv.length > 0 ? hex.mv.map(i => YN[i]).join("、") : "無";
    let t = `【六爻起卦結果】\n占問：${question}\n\n`;
    if (hex.bazi) t += `四柱：${hex.bazi.y}年 ${hex.bazi.m}月 ${hex.bazi.d}日 ${hex.bazi.h}時\n`;
    if (hex.palace) t += `卦宮：${hex.palace}宮（屬${hex.palaceWx}）\n`;
    t += `本卦：${hex.o}（第${hex.oN}卦）\n`;
    if (hex.hasM) t += `變卦：${hex.c}（第${hex.cN}卦）\n`;
    t += `動爻：${ms}\n\n六爻詳情（上爻→初爻）：\n`;
    for (let i = 5; i >= 0; i--) {
      const y = yaos[i]; const ln = hex.lines[i];
      let row = ` ${YN[i]}`;
      if (ln.role) row += `【${ln.role}】`;
      row += ` ${ln.sh || ""} ${ln.z}${ln.zwx}`;
      if (ln.lq) row += ` ${ln.lq}`;
      row += ` ─ ${y.c.join("·")}=${y.v} ${y.t}`;
      if (y.m && ln.cZ) row += `  變→ ${ln.cZ}${ZHI_WX[ln.cZ]}${ln.cLq?" "+ln.cLq:""}`;
      t += row + "\n";
    }
    return t;
  }

  return (
    <Wrap><BkBtn onClick={onBack} />
      <div style={{ padding:"76px 24px 40px", animation:"fu 0.6s ease" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <h1 className="it" style={{ fontSize:24, fontWeight:300, fontStyle:"italic", letterSpacing:2 }}>Sei Linee</h1>
          <div style={{ fontSize:12, color:"#888", marginTop:6, letterSpacing:3 }}>六 爻 起 卦</div>
          <div style={{ fontSize:11, color:"#aaa", marginTop:5, letterSpacing:2 }}>
            {cur < 6 ? `第 ${cur+1} 爻 / 共 6 爻` : "卦象已成"}
          </div>
        </div>
        {cur < 6 && (
          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ display:"flex", justifyContent:"center", gap:14, marginBottom:22 }}>
              {[0,1,2].map(ci => (
                <div key={ci} className={`coin${spin?" spin":""}`} style={{ animationDelay:`${ci*0.08}s` }} />
              ))}
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <PBtn onClick={doOne} disabled={busy} style={{ flex:1 }}>擲 銅 錢</PBtn>
              <GBtn onClick={doAll} style={{ flex:1 }}>一 鍵 六 爻</GBtn>
            </div>
            {cur > 0 && <button onClick={reset} style={{ background:"none", border:"none", color:"#aaa", fontSize:11, marginTop:12, letterSpacing:1, fontFamily:"'Noto Serif TC',serif" }}>← 重擲</button>}
          </div>
        )}

        {yaos.length > 0 && (
          <div style={{ background:"#fff", borderRadius:12, padding:"16px 14px", marginBottom:22, boxShadow:"0 1px 8px rgba(0,0,0,0.04)", border:"1px solid #ddd9d2" }}>
            {hex && (
              <div style={{ display:"flex", fontSize:9, color:"#aaa", letterSpacing:1, paddingBottom:8, marginBottom:6, borderBottom:"1px dashed #eae6df", textAlign:"center" }}>
                <span style={{ width:28 }}>爻位</span>
                <span style={{ width:26 }}>六神</span>
                <span style={{ width:36 }}>地支</span>
                <span style={{ width:30 }}>六親</span>
                <span style={{ flex:1, textAlign:"left", paddingLeft:6 }}>爻象</span>
                <span style={{ width:22 }}>世應</span>
              </div>
            )}
            {[...yaos].reverse().map((y, ri) => {
              const i = yaos.length - 1 - ri;
              const ln = hex ? hex.lines[i] : null;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", padding:"7px 0", animation:"sd 0.3s ease", borderBottom:ri<yaos.length-1?"1px solid #f3efe8":"none", fontSize:10.5, color:"#555" }}>
                  <span style={{ width:28, fontSize:10, color:"#888", textAlign:"center", flexShrink:0 }}>{YN[i]}</span>
                  <span style={{ width:26, fontSize:9.5, color:"#9a8868", textAlign:"center", flexShrink:0, letterSpacing:0.5 }}>{ln ? ln.sh || "" : ""}</span>
                  <span style={{ width:36, textAlign:"center", flexShrink:0, color:"#2c2c2c", fontWeight:500 }}>
                    {ln ? <>{ln.z}<span style={{ fontSize:9, color:"#aaa", marginLeft:1 }}>{ln.zwx}</span></> : ""}
                  </span>
                  <span style={{ width:30, fontSize:10, color:"#4a6b4e", textAlign:"center", flexShrink:0, fontWeight:500 }}>{ln ? ln.lq || "" : ""}</span>
                  <div style={{ flex:1, display:"flex", alignItems:"center", gap:5, paddingLeft:6, minWidth:0 }}>
                    <div style={{ display:"flex", gap:3, alignItems:"center", flexShrink:0 }}>
                      {y.l === 1
                        ? <div style={{ width:38, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} />
                        : <><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /><div style={{ width:4 }} /><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /></>
                      }
                    </div>
                    <span style={{ fontSize:8.5, color:y.m?"#b8956a":"#aaa", whiteSpace:"nowrap" }}>{y.m?"○動":""}</span>
                  </div>
                  <span style={{ width:22, fontSize:10, fontWeight:600, color:ln && ln.role==="世"?"#b8956a":ln && ln.role==="應"?"#6b8f71":"#ccc", textAlign:"center", flexShrink:0 }}>{ln ? ln.role || "" : ""}</span>
                </div>
              );
            })}

            {hex && hex.hasM && (
              <div style={{ marginTop:10, paddingTop:10, borderTop:"1px dashed #eae6df", fontSize:10, color:"#888", lineHeight:1.9 }}>
                <div style={{ fontSize:9, color:"#b8956a", letterSpacing:2, marginBottom:4 }}>變 爻</div>
                {hex.mv.slice().reverse().map(idx => {
                  const ln = hex.lines[idx];
                  return (
                    <div key={idx} style={{ display:"flex", gap:8 }}>
                      <span style={{ color:"#999" }}>{YN[idx]}：</span>
                      <span>{ln.z}{ln.zwx}{ln.lq?" "+ln.lq:""} → {ln.cZ}{ZHI_WX[ln.cZ]}{ln.cLq?" "+ln.cLq:""}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {hex && (
          <div style={{ animation:"slideUp 0.6s ease" }}>
            <div style={{ background:"#fff", borderRadius:12, padding:"22px 20px", marginBottom:22, textAlign:"center", border:"1px solid #c5d8c7", boxShadow:"0 2px 14px rgba(107,143,113,0.08)" }}>
              <div className="it" style={{ fontSize:11, color:"#aaa", letterSpacing:4, marginBottom:14, fontStyle:"italic" }}>Responso</div>

              {hex.bazi && (
                <div style={{ fontSize:10.5, color:"#888", lineHeight:1.9, marginBottom:14, letterSpacing:1 }}>
                  <div style={{ fontSize:9, color:"#b8956a", letterSpacing:3, marginBottom:4 }}>年 月 日 時</div>
                  <div>{hex.bazi.y}年・{hex.bazi.m}月</div>
                  <div>{hex.bazi.d}日・{hex.bazi.h}時</div>
                </div>
              )}

              {hex.palace && (
                <div style={{ fontSize:10.5, color:"#666", marginBottom:12, letterSpacing:2 }}>
                  {hex.palace}宮　屬{hex.palaceWx}
                </div>
              )}

              <div style={{ fontSize:26, letterSpacing:6, color:"#2c2c2c", fontWeight:500 }}>{hex.o}</div>
              <div style={{ fontSize:12, color:"#888", marginTop:4 }}>第{hex.oN}卦</div>

              {hex.hasM && (<>
                <div style={{ width:1, height:20, background:"#ddd9d2", margin:"12px auto" }} />
                <div style={{ fontSize:10, color:"#aaa", letterSpacing:3, marginBottom:6 }}>變 卦</div>
                <div style={{ fontSize:26, letterSpacing:6, color:"#b8956a", fontWeight:500 }}>{hex.c}</div>
                <div style={{ fontSize:12, color:"#888", marginTop:4 }}>第{hex.cN}卦</div>
                <div style={{ marginTop:14, padding:"6px 14px", background:"#eaf1eb", borderRadius:6, display:"inline-block", fontSize:11, color:"#4a6b4e", letterSpacing:2 }}>
                  動爻：{hex.mv.map(i => YN[i]).join("、")}
                </div>
              </>)}
            </div>
            <PBtn onClick={() => onResult({ text: fmt(), hex, yaos, question, system: "liuyao" })}>Risultato</PBtn>
          </div>
        )}
      </div></Wrap>
  );
}

            </div>

            {/* 可展開的六爻詳情 */}
            <button onClick={() => setShowDetail(!showDetail)} style={{ width:"100%", padding:"16px 18px", background:"#fff", border:"1px solid #eae6df", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:showDetail?0:30, borderBottomLeftRadius:showDetail?0:10, borderBottomRightRadius:showDetail?0:10, boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
              <span style={{ fontSize:12, color:"#888", letterSpacing:2 }}>六 爻 詳 情</span>
              <span style={{ fontSize:11, color:"#aaa", transition:"transform 0.3s", transform:showDetail?"rotate(180deg)":"rotate(0deg)" }}>▼</span>
            </button>
            {showDetail && (
              <div style={{ background:"#fff", borderTop:"1px dashed #eae6df", borderLeft:"1px solid #eae6df", borderRight:"1px solid #eae6df", borderBottom:"1px solid #eae6df", borderBottomLeftRadius:10, borderBottomRightRadius:10, padding:"16px 14px", marginBottom:30, animation:"sd 0.3s ease", boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
                {/* 四柱完整 */}
                {result.hex.bazi && (
                  <div style={{ fontSize:10, color:"#888", textAlign:"center", marginBottom:14, lineHeight:1.8, letterSpacing:1 }}>
                    {result.hex.bazi.y}年・{result.hex.bazi.m}月・{result.hex.bazi.d}日・{result.hex.bazi.h}時
                  </div>
                )}
                {/* 表格 */}
                <div style={{ display:"flex", fontSize:9, color:"#aaa", letterSpacing:1, paddingBottom:10, marginBottom:8, borderBottom:"1px dashed #eae6df", textAlign:"center" }}>
                  <span style={{ width:28 }}>爻位</span>
                  <span style={{ width:26 }}>六神</span>
                  <span style={{ width:36 }}>地支</span>
                  <span style={{ width:30 }}>六親</span>
                  <span style={{ flex:1, textAlign:"left", paddingLeft:6 }}>爻象</span>
                  <span style={{ width:22 }}>世應</span>
                </div>
                {[...result.yaos].reverse().map((y, ri) => {
                  const i = result.yaos.length - 1 - ri;
                  const ln = result.hex.lines[i];
                  return (
                    <div key={i} style={{ display:"flex", alignItems:"center", padding:"9px 0", borderBottom:ri<result.yaos.length-1?"1px solid #f3efe8":"none", fontSize:10.5, color:"#555" }}>
                      <span style={{ width:28, fontSize:10, color:"#888", textAlign:"center", flexShrink:0 }}>{YN[i]}</span>
                      <span style={{ width:26, fontSize:9.5, color:"#9a8868", textAlign:"center", flexShrink:0, letterSpacing:0.5 }}>{ln ? ln.sh || "" : ""}</span>
                      <span style={{ width:36, textAlign:"center", flexShrink:0, color:"#2c2c2c", fontWeight:500 }}>
                        {ln ? <>{ln.z}<span style={{ fontSize:9, color:"#aaa", marginLeft:1 }}>{ln.zwx}</span></> : ""}
                      </span>
                      <span style={{ width:30, fontSize:10, color:"#4a6b4e", textAlign:"center", flexShrink:0, fontWeight:500 }}>{ln ? ln.lq || "" : ""}</span>
                      <div style={{ flex:1, display:"flex", alignItems:"center", gap:5, paddingLeft:6, minWidth:0 }}>
                        <div style={{ display:"flex", gap:3, alignItems:"center", flexShrink:0 }}>
                          {y.l === 1
                            ? <div style={{ width:38, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} />
                            : <><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /><div style={{ width:4 }} /><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /></>
                          }
                        </div>
                        <span style={{ fontSize:8.5, color:y.m?"#b8956a":"#aaa", whiteSpace:"nowrap" }}>{y.m?"○動":""}</span>
                      </div>
                      <span style={{ width:22, fontSize:10, fontWeight:600, color:ln && ln.role==="世"?"#b8956a":ln && ln.role==="應"?"#6b8f71":"#ccc", textAlign:"center", flexShrink:0 }}>{ln ? ln.role || "" : ""}</span>
                    </div>
                  );
                })}
                {result.hex.hasM && (
                  <div style={{ marginTop:14, paddingTop:14, borderTop:"1px dashed #eae6df", fontSize:10, color:"#888", lineHeight:2.0 }}>
                    <div style={{ fontSize:9, color:"#b8956a", letterSpacing:2, marginBottom:6 }}>變 爻</div>
                    {result.hex.mv.slice().reverse().map(idx => {
                      const ln = result.hex.lines[idx];
                      return (
                        <div key={idx} style={{ display:"flex", gap:8, marginBottom:2 }}>
                          <span style={{ color:"#999" }}>{YN[idx]}：</span>
                          <span>{ln.z}{ln.zwx}{ln.lq?" "+ln.lq:""} → {ln.cZ}{ZHI_WX[ln.cZ]}{ln.cLq?" "+ln.cLq:""}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        ) : (
          <div style={{ background:"#fff", borderRadius:12, padding:22, marginBottom:22, boxShadow:"0 1px 8px rgba(0,0,0,0.04)", border:"1px solid #ddd9d2", whiteSpace:"pre-wrap", fontSize:12, lineHeight:1.95, color:"#555", fontFamily:"'Noto Serif TC',ui-monospace,monospace" }}>{copyText}</div>
        )}

        <div style={{ display:"flex", gap:10 }}>
          <PBtn onClick={copy} style={{ flex:1 }}>{cp ? "Copiato ✓" : "Copia"}</PBtn>
          <GBtn onClick={onRestart} style={{ flex:1 }}>Di Nuovo</GBtn>
        </div>
      </div></Wrap>
  );
}

/* ═══ APP ═══ */
function App() {
  const [pg, setPg] = useState("q");
  const [q, setQ] = useState("");
  const [sys, setSys] = useState(null);
  const [cnt, setCnt] = useState(3);
  const [res, setRes] = useState(null);
  return (<>
    {pg === "q" && <PageQ onNext={v => { setQ(v); setPg("s"); }} />}
    {pg === "s" && <PageS question={q} onNext={(s, c) => { setSys(s); setCnt(c); setPg("d"); }} onBack={() => setPg("q")} />}
    {pg === "d" && sys === "liuyao" && <PageY question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
    {pg === "d" && sys !== "liuyao" && <PageC system={sys} cnt={cnt} question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
    {pg === "r" && res && <PageR result={res} onRestart={() => { setPg("q"); setQ(""); setSys(null); setRes(null); }} />}
  </>);
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e) {
  document.getElementById("root").innerHTML = '<pre style="padding:20px;color:red;font-size:12px;white-space:pre-wrap">React 渲染錯誤：' + e.message + '</pre>';
}
</script>
</body>
</html>

.coin { width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 35%,#e8d5a8,#c9a96e 50%,#a07840); box-shadow:0 3px 8px rgba(160,120,64,0.3),inset 0 1px 2px rgba(255,255,255,0.35); position:relative; animation: coinDrop 0.35s ease both; transition:filter .3s; }
.coin::after { content:''; width:9px; height:9px; border:1.5px solid rgba(255,255,255,0.25); position:absolute; border-radius:1px; }
.coin.rev { filter:saturate(.55) brightness(.88); }
.coin.spin { animation: cspin 0.75s cubic-bezier(0.4,0,0.2,1); }
.toss { font-size:11px; color:var(--muted); letter-spacing:2px; margin:-10px 0 18px; animation:fadeIn .3s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
`;

    <div className="bg" aria-hidden="true" />

}

function TopBar({ onBack, step }) {
  return (
    <div className="top">
      {onBack ? (

}

// 三種牌共用的牌面資訊：mark 上方標記、name 牌名、sub 副標、tag 正逆位
function cardMeta(c, system) {
  if (system === "tarot") {
    const mi = TAROT_MAJOR.indexOf(c.name);
    const tag = c.rev ? "逆位" : "正位";
    return mi >= 0
      ? { mark: ROMAN[mi], name: c.name, sub: "大秘儀", tag, rev: c.rev }
      : { mark: TAROT_SUIT_IT[c.name.slice(0, 2)], markIt: true, name: c.name, sub: "", tag, rev: c.rev };
  }
  if (system === "sibilla") return { mark: c.suit, name: c.name, sub: c.it, subIt: true };
  const [num, ...rest] = c.name.split(" ");
  return { mark: num, name: rest.join(" "), sub: "" };
}

function CardFace({ c, system }) {
  const m = cardMeta(c, system);
  return (<>
    <div className="cf-frame" />
    <div className={"cf-mark it" + (m.markIt ? " sm-it" : "")}>{m.mark}</div>
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", transform:c.rev ? "rotate(180deg)" : "none" }}>
      <div className="cf-star">✦</div>
      <div className={"cf-name" + (m.name.length >= 4 ? " long" : "")}>{m.name}</div>
    </div>
    {m.tag ? <div className={"cf-foot" + (m.rev ? " rev" : "")}>{m.tag}</div>
      : m.subIt ? <div className="cf-foot it">{m.sub}</div> : null}
  </>);
}

/* ═══ CARD DRAW ═══ */
function PageC({ system, cnt, question, onResult, onBack }) {
  const [cards] = useState(() => system === "tarot" ? drawT(cnt) : system === "sibilla" ? drawS(cnt) : drawL(cnt));
  const [phase, setPhase] = useState("shuffle");
  const [open, setOpen] = useState([]);
  const tmrs = useRef([]);
  const later = (fn, ms) => { tmrs.current.push(setTimeout(fn, ms)); };

  useEffect(() => {
    later(() => setPhase("deal"), 1700);
    // 發牌動畫結束後，逐張自動翻開
    const start = 1700 + cnt * 130 + 700;
    for (let i = 0; i < cnt; i++) later(() => reveal(i), start + i * 750);
    return () => tmrs.current.forEach(clearTimeout);
  }, []);

  const sm = cnt > 3;
  const done = open.length === cnt;

  function reveal(i) { buzz(8); setOpen(p => p.includes(i) ? p : [...p, i]); }

  function fmt() {
    const sn = { tarot:"塔羅", lenormand:"雷諾曼", sibilla:"西比拉卡" }[system];
    return `【${sn}${cnt}張牌結果】\n占問：${question}\n\n牌面：${cards.map(c => cardLabel(c, system)).join("、")}`;
  }
  function finish() {
    onResult({ text: fmt(), system, cards, question });
  }

  const rows = sm ? [[0, 1, 2], [3, 4]] : [[0, 1, 2]];
  const slot = i => {
    const on = open.includes(i);
    return (
      <div key={i} className={"slot" + (on ? " on" : "")}>
        <div className={"tcard" + (sm ? " sm" : "") + (on ? " on" : "")} style={{ animationDelay:`${i * 0.13}s` }}
          role="img" aria-label={on ? `第${POS_CN[i]}張：${cardLabel(cards[i], system)}` : `第${POS_CN[i]}張（未翻開）`}>
          <div className="tc-in">
            <CardBack />
            <div className="side face"><CardFace c={cards[i]} system={system} /></div>
          </div>
        </div>
        <div className="pos">第{POS_CN[i]}張</div>
      </div>
    );
  };

  return (<>
    <TopBar onBack={onBack} step={2} />
    <div className="page">
      <Head it={SYS_IT[system]} zh={SYS_ZH[system]} />
      {phase === "shuffle" ? (
        <div style={{ animation:"fadeIn .4s ease" }}>
          <div className="deck" aria-hidden="true">
            <div className="d0"><CardBack /></div>
            <div className="d1"><CardBack /></div>
            <div className="d2"><CardBack /></div>
          </div>
          <div className="wait">靜心洗牌</div>
          <div style={{ textAlign:"center", fontSize:12, color:"var(--faint)", marginTop:16, lineHeight:1.9, padding:"0 12px" }}>
            默念：{question.length > 40 ? question.slice(0, 40) + "⋯" : question}
          </div>
        </div>
      ) : (<>
        <div className="spread">{rows.map((r, k) => <div className="row" key={k}>{r.map(slot)}</div>)}</div>
        {!done ? (
          <div style={{ textAlign:"center", animation:`fadeIn .6s ease ${cnt * 0.13 + 0.3}s both` }}>
            <div className="hint" style={{ animation:"breathe 1.8s ease-in-out infinite" }}>牌面揭曉中　<span style={{ color:"var(--faint)", fontVariantNumeric:"tabular-nums" }}>{open.length} / {cnt}</span></div>
          </div>
        ) : (
          <div style={{ animation:"slideUp .5s ease .6s both" }}>
            <div className="hint" style={{ marginBottom:18, color:"var(--gold)" }}>✦　牌面已開　✦</div>
            <PBtn onClick={finish}>查看結果</PBtn>
          </div>
        )}
      </>)}
    </div>
  </>);
}

/* ═══ LIU YAO ═══ */
function PageY({ question, onResult, onBack }) {
  const [yaos, setYaos] = useState([]);
  const [busy, setBusy] = useState(false);
  const [cur, setCur] = useState(0);
  const [hex, setHex] = useState(null);
  const [spin, setSpin] = useState(false);

  function doOne() {
    if (cur >= 6 || busy) return;
    setBusy(true); setSpin(true);
    setTimeout(() => {
      setSpin(false);
      const y = tossYao();
      const ny = [...yaos, y];
      setYaos(ny); setCur(p => p + 1); setBusy(false); buzz(12);
      if (ny.length === 6) setHex(compHex(ny));
    }, 700);
  }
  function doAll() {
    if (busy) return;
    setBusy(true);
    const all = []; let i = 0;
    function next() {
      if (i >= 6) { setBusy(false); setSpin(false); setHex(compHex(all)); return; }
      setSpin(true);
      setTimeout(() => {
        all.push(tossYao()); buzz(8);
        setYaos([...all]); setCur(all.length);
        setSpin(false); i++;
        setTimeout(next, 250);
      }, 500);
    }
    next();
  }
  const last = yaos.length ? yaos[yaos.length - 1] : null;
  function reset() { setYaos([]); setCur(0); setHex(null); }

  function fmt() {
    const ms = hex.mv.length > 0 ? hex.mv.map(i => YN[i]).join("、") : "無";
    let t = `【六爻起卦結果】\n占問：${question}\n\n`;
    if (hex.bazi) t += `四柱：${hex.bazi.y}年 ${hex.bazi.m}月 ${hex.bazi.d}日 ${hex.bazi.h}時\n`;
    if (hex.palace) t += `卦宮：${hex.palace}宮（屬${hex.palaceWx}）\n`;
    t += `本卦：${hex.o}（第${hex.oN}卦）\n`;
    if (hex.hasM) t += `變卦：${hex.c}（第${hex.cN}卦）\n`;
    t += `動爻：${ms}\n\n六爻詳情（上爻→初爻）：\n`;
    for (let i = 5; i >= 0; i--) {
      const y = yaos[i]; const ln = hex.lines[i];
      let row = ` ${YN[i]}`;
      if (ln.role) row += `【${ln.role}】`;
      row += ` ${ln.sh || ""} ${ln.z}${ln.zwx}`;
      if (ln.lq) row += ` ${ln.lq}`;
      row += ` ─ ${y.c.join("·")}=${y.v} ${y.t}`;
      if (y.m && ln.cZ) row += `  變→ ${ln.cZ}${ZHI_WX[ln.cZ]}${ln.cLq?" "+ln.cLq:""}`;
      t += row + "\n";
    }
    return t;
  }

  return (
    <><TopBar onBack={onBack} step={2} />
      <div className="page">
        <Head it="Sei Linee" zh="六爻起卦" />
        <div className="hint" style={{ margin:"-12px 0 26px", color:"var(--faint)" }}>
          {cur < 6 ? `第 ${cur+1} 爻 / 共 6 爻` : "卦象已成"}
        </div>
        {cur < 6 && (
          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ display:"flex", justifyContent:"center", gap:18, marginBottom:22 }}>
              {[0,1,2].map(ci => (
                <div key={ci} className={`coin${spin?" spin":""}${!spin && last && last.c[ci]==="反"?" rev":""}`} style={{ animationDelay:`${ci*0.08}s` }} />
              ))}
            </div>
            {last && !spin && <div className="toss">{last.c.join(" · ")}　{last.t}</div>}
            <div style={{ display:"flex", gap:10 }}>
              <PBtn onClick={doOne} disabled={busy} style={{ flex:1 }}>擲銅錢</PBtn>
              <GBtn onClick={doAll} style={{ flex:1 }}>一鍵六爻</GBtn>
            </div>
            {cur > 0 && <button className="textbtn" onClick={reset}>重新擲卦</button>}
          </div>
        )}

        {yaos.length > 0 && (
          <div className="panel" style={{ padding:"8px 18px", marginBottom:22 }}>
            <YaoTable yaos={yaos} hex={hex} />
          </div>
        )}

        {hex && (
          <div style={{ animation:"slideUp 0.6s ease" }}>
            <div className="panel" style={{ padding:"22px 16px 20px", marginBottom:22 }}>
              <HexPair hex={hex} />
              {(hex.bazi || hex.palace) && (
                <div className="hint" style={{ marginTop:16, fontSize:10.5, color:"var(--faint)", lineHeight:1.9 }}>
                  {hex.palace && <div>{hex.palace}宮・屬{hex.palaceWx}</div>}
                  {hex.bazi && <div>{hex.bazi.y}年 {hex.bazi.m}月 {hex.bazi.d}日 {hex.bazi.h}時</div>}
                </div>
              )}
            </div>
            <PBtn onClick={() => onResult({ text: fmt(), hex, yaos, question, system: "liuyao" })}>查看結果</PBtn>
          </div>
        )}
      </div></>
  );
}

          </div>
          <div className="panel" style={{ marginBottom:24, overflow:"hidden" }}>
            <button className={"fold" + (showDetail ? " on" : "")} onClick={() => setShowDetail(!showDetail)} aria-expanded={showDetail}>
              <span>六爻詳情</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            {showDetail && (
              <div style={{ padding:"0 18px 14px", animation:"sd 0.3s ease" }}>
                {hex.bazi && <div className="hint" style={{ fontSize:10.5, color:"var(--faint)", padding:"2px 0 12px" }}>{hex.bazi.y}年・{hex.bazi.m}月・{hex.bazi.d}日・{hex.bazi.h}時</div>}
                <YaoTable yaos={result.yaos} hex={hex} />
              </div>
            )}
          </div>
        </div>
      ) : result.cards ? (
        <div>
          <div className="panel" style={{ padding:"4px 18px", marginBottom:16 }}>
            {result.cards.map((c, i) => {
              const m = cardMeta(c, result.system);
              return (
                <div key={i} className="crow" style={{ animationDelay:`${i * 0.08}s` }}>
                  <div className={"cmark it" + (m.markIt ? " sm-it" : "")}>{m.mark}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div className="cpos">第{POS_CN[i]}張{m.sub && <>　<span className={m.subIt ? "it" : ""}>{m.sub}</span></>}</div>
                    <div className="cname">{m.name}</div>
                  </div>
                  {m.tag && <span className={"ctag" + (m.rev ? " rev" : "")}>{m.tag}</span>}
                </div>
              );
            })}
          </div>
          <p className="note">可複製牌面結果，留存或交由占卜師進一步解讀。</p>
        </div>
      ) : (
        <div className="panel" style={{ padding:22, marginBottom:22, whiteSpace:"pre-wrap", fontSize:12, lineHeight:1.95, color:"var(--ink2)" }}>{copyText}</div>
      )}

      <div style={{ display:"flex", gap:10 }}>
        <PBtn onClick={copy} style={{ flex:1 }}>{cp === "ok" ? "已複製 ✓" : cp === "fail" ? "請長按手動複製" : "複製結果"}</PBtn>
        <GBtn onClick={onRestart} style={{ flex:1 }}>重新占卜</GBtn>
      </div>
    </div>
  </>);
}

/* ═══ APP ═══ */
function App() {
  const [pg, setPg] = useState("q");
  const [q, setQ] = useState("");
  const [sys, setSys] = useState(null);
  const [cnt, setCnt] = useState(3);
  const [res, setRes] = useState(null);
  useEffect(() => { window.scrollTo(0, 0); }, [pg]);
  return (<>
    <style>{G}</style>
    <Backdrop />
    <div className="shell"><div className="col">
      {pg === "q" && <PageQ onNext={v => { setQ(v); setPg("s"); }} />}
      {pg === "s" && <PageS question={q} onNext={(s, c) => { setSys(s); setCnt(c); setPg("d"); }} onBack={() => setPg("q")} />}
      {pg === "d" && sys === "liuyao" && <PageY question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
      {pg === "d" && sys !== "liuyao" && <PageC system={sys} cnt={cnt} question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
      {pg === "r" && res && <PageR result={res} onRestart={() => { setPg("q"); setQ(""); setSys(null); setRes(null); }} />}
    </div></div>
  </>);
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e) {
  document.getElementById("root").innerHTML = '<pre style="padding:20px;color:red;font-size:12px;white-space:pre-wrap">React 渲染錯誤：' + e.message + '</pre>';
}
</script>
</body>
</html>

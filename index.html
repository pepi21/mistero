<style>

    transition:transform .15s ease, opacity .2s ease, background .2s ease, border .2s ease;
  }
  button:active { transform:scale(.96); }
  button:disabled { cursor:not-allowed; }
  textarea:focus {
    outline:none;
    border-color:#6b8f71!important;
    box-shadow:0 0 0 3px rgba(107,143,113,.08)!important;
  }
  ::selection { background:#c5d8c7; color:#4a6b4e; }
  .page-shell {
    min-height:100vh;
    background:#f3f0ea;
    display:flex;
    justify-content:center;
  }
  .page-inner {
    width:100%;
    max-width:420px;
    min-height:100vh;
    position:relative;
  }
  .fade { animation:fu .55s ease both; }
  .slide { animation:sd .3s ease both; }
  @keyframes fu { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes sd { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes cspin {
    0%{transform:rotateY(0) scale(1) translateY(0)}
    30%{transform:rotateY(180deg) scale(.9) translateY(-18px)}
    70%{transform:rotateY(540deg) scale(.92) translateY(-6px)}
    100%{transform:rotateY(720deg) scale(1) translateY(0)}
  }
  @keyframes coinDrop { 0%{transform:scale(.7); opacity:0} 50%{transform:scale(1.08)} 100%{transform:scale(1); opacity:1} }
  .it { font-family:"Cormorant Garamond","Times New Roman","Noto Serif TC",serif; }
  .divider { width:36px; height:1px; background:#ccc8c0; margin:0 auto; }
  .back {
    position:absolute; top:18px; left:20px; z-index:10;
    background:none; border:none; color:#888; font-size:13px;
    letter-spacing:2px; padding:8px 0;
  }
  .primary {
    width:100%; padding:15px 0; border:none; border-radius:8px;
    background:#6b8f71; color:#fff; font-size:14px; letter-spacing:5px;

    background:#ddd9d2; color:#aaa; box-shadow:none; opacity:.6;
  }
  .ghost {

    border:1px solid #ddd9d2; border-radius:8px; font-size:13px; letter-spacing:3px;
  }
  .panel {
    background:#fff; border:1px solid #ddd9d2; box-shadow:0 1px 10px rgba(0,0,0,.04);

  }
  .chip {
    background:#eaf1eb; border:none; border-radius:20px; padding:6px 13px;
    font-size:11px; color:#4a6b4e; letter-spacing:.3px;
  }
  .sys-btn {
    display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px;
    background:#fff; border:1px solid #ddd9d2; border-radius:10px; text-align:left;
    position:relative; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .sys-btn.active { background:#eaf1eb; border:1.5px solid #6b8f71; box-shadow:0 2px 12px rgba(107,143,113,.1); }
  .sys-icon {
    font-size:18px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;

  }
  .sys-btn.active .sys-icon { background:#6b8f71; color:#fff; }
  .tag {
    position:absolute; top:10px; right:14px; font-size:9.5px; color:#b8956a;
    border:1px solid #d4b896; padding:2px 9px; border-radius:4px; letter-spacing:1px;
  }
  .count-btn {
    flex:1; padding:13px 0; background:#fff; border:1px solid #ddd9d2; border-radius:8px;
    text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .count-btn.active { background:#eaf1eb; border:1.5px solid #6b8f71; }
  .card-wrap { perspective:600px; flex-shrink:0; transition:transform .4s ease; }
  .card-wrap.show { transform:translateY(-4px); }
  .card {
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,0,.2,1);
  }
  .card-wrap.show .card { transform:rotateY(180deg); }
  .card-face {
    position:absolute; width:100%; height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:10px; display:flex; align-items:center; justify-content:center;
  }
  .card-back {
    background:linear-gradient(155deg,#6b8f71,#4a6b4e);
    box-shadow:0 2px 8px rgba(0,0,0,.1);

  .card-back-inner {
    width:68%; height:78%; border:1px solid rgba(255,255,255,.15); border-radius:6px;
    display:flex; align-items:center; justify-content:center;

    transform:rotateY(180deg); background:#fff; border:1px solid #ddd9d2;
    flex-direction:column; box-shadow:0 3px 14px rgba(0,0,0,.08); position:relative;
    text-align:center;

  .coin {
    width:38px; height:38px; border-radius:50%;

    background:radial-gradient(circle at 35% 35%,#e8d5a8,#c9a96e 50%,#a07840);
    box-shadow:0 2px 6px rgba(160,120,64,.3), inset 0 1px 2px rgba(255,255,255,.35);
    position:relative; animation:coinDrop .35s ease both;
  }
  .coin::after {
    content:""; width:8px; height:8px; border:1.5px solid rgba(255,255,255,.22);
    position:absolute; border-radius:1px;

    box-shadow:0 1px 8px rgba(0,0,0,.04); border:1px solid #ddd9d2;
    white-space:pre-wrap; font-size:12px; line-height:1.95; color:#555;

  const ZHI_WX = {子:"水",丑:"土",寅:"木",卯:"木",辰:"土",巳:"火",午:"火",未:"土",申:"金",酉:"金",戌:"土",亥:"水"};

    兌:{l:["巳","卯","丑"],u:["亥","酉","未"]}
  };
  const PALACE = {
    "乾":{p:"乾",s:6,r:3},"姤":{p:"乾",s:1,r:4},"遁":{p:"乾",s:2,r:5},"否":{p:"乾",s:3,r:6},
    "觀":{p:"乾",s:4,r:1},"剝":{p:"乾",s:5,r:2},"晉":{p:"乾",s:4,r:1},"大有":{p:"乾",s:3,r:6},
    "坎":{p:"坎",s:6,r:3},"節":{p:"坎",s:1,r:4},"屯":{p:"坎",s:2,r:5},"既濟":{p:"坎",s:3,r:6},
    "革":{p:"坎",s:4,r:1},"豐":{p:"坎",s:5,r:2},"明夷":{p:"坎",s:4,r:1},"師":{p:"坎",s:3,r:6},
    "艮":{p:"艮",s:6,r:3},"賁":{p:"艮",s:1,r:4},"大畜":{p:"艮",s:2,r:5},"損":{p:"艮",s:3,r:6},
    "睽":{p:"艮",s:4,r:1},"履":{p:"艮",s:5,r:2},"中孚":{p:"艮",s:4,r:1},"漸":{p:"艮",s:3,r:6},
    "震":{p:"震",s:6,r:3},"豫":{p:"震",s:1,r:4},"解":{p:"震",s:2,r:5},"恆":{p:"震",s:3,r:6},
    "升":{p:"震",s:4,r:1},"井":{p:"震",s:5,r:2},"大過":{p:"震",s:4,r:1},"隨":{p:"震",s:3,r:6},
    "巽":{p:"巽",s:6,r:3},"小畜":{p:"巽",s:1,r:4},"家人":{p:"巽",s:2,r:5},"益":{p:"巽",s:3,r:6},
    "無妄":{p:"巽",s:4,r:1},"噬嗑":{p:"巽",s:5,r:2},"頤":{p:"巽",s:4,r:1},"蠱":{p:"巽",s:3,r:6},
    "離":{p:"離",s:6,r:3},"旅":{p:"離",s:1,r:4},"鼎":{p:"離",s:2,r:5},"未濟":{p:"離",s:3,r:6},
    "蒙":{p:"離",s:4,r:1},"渙":{p:"離",s:5,r:2},"訟":{p:"離",s:4,r:1},"同人":{p:"離",s:3,r:6},
    "坤":{p:"坤",s:6,r:3},"復":{p:"坤",s:1,r:4},"臨":{p:"坤",s:2,r:5},"泰":{p:"坤",s:3,r:6},

  const LIUSHEN = {
    甲:["青龍","朱雀","勾陳","螣蛇","白虎","玄武"],

  const systems = [
    { id:"tarot", n:"塔 羅", sub:"78張完整牌組・正逆位", ic:"✦" },
    { id:"lenormand", n:"雷 諾 曼", sub:"36張指引牌", ic:"◇" },

  const state = {

    cnt:3,

  let timer = null;
  const root = document.getElementById("root");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function clearTimer() {
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
  }

  function shell(inner) {
    return `<div class="page-shell"><div class="page-inner">${inner}</div></div>`;
  }

  function divider() { return `<div class="divider"></div>`; }
  function backButton() { return `<button class="back" data-action="back">← 返回</button>`; }

  function suggest(q) {
    const lk = ["該不該","要不要","是不是","會不會","還是","選","可不可以","有沒有","能不能","好不好","對不對","值不值"];
    const yk = ["會怎樣","怎麼樣","最後","結果","成不成","發展","走向","未來會","能不能成","後來","結局","下場"];
    if (lk.some(k => q.includes(k))) return "lenormand";
    if (yk.some(k => q.includes(k))) return "liuyao";
    return "tarot";
  }

  function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  }
  function drawT(n) { return shuffle(ALL_TAROT).slice(0, n).map(c => ({ name:c, rev:Math.random() < 0.5 })); }
  function drawL(n) { return shuffle(LENORMAND).slice(0, n).map(c => ({ name:c })); }

  function tossYao() {
    const c = [Math.random() < 0.5 ? "正" : "反", Math.random() < 0.5 ? "正" : "反", Math.random() < 0.5 ? "正" : "反"];
    const h = c.filter(x => x === "正").length;
    if (h === 3) return { c, v:9, t:"老陽（動）", l:1, m:true };
    if (h === 2) return { c, v:8, t:"少陰", l:0, m:false };
    if (h === 1) return { c, v:7, t:"少陽", l:1, m:false };
    return { c, v:6, t:"老陰（動）", l:0, m:true };
  }

  function getTri(lines) {
    for (const [name, pattern] of Object.entries(BAGUA_LINES)) {
      if (pattern[0] === lines[0] && pattern[1] === lines[1] && pattern[2] === lines[2]) return name;
    }
    return "";
  }

  function liuqin(meWx, zhiWx) {
    if (meWx === zhiWx) return "兄弟";
    const sheng = {木:"水",火:"木",土:"火",金:"土",水:"金"};
    const ke = {木:"金",火:"水",土:"木",金:"火",水:"土"};
    const woSheng = {水:"木",木:"火",火:"土",土:"金",金:"水"};
    if (sheng[meWx] === zhiWx) return "父母";
    if (ke[meWx] === zhiWx) return "官鬼";
    if (woSheng[meWx] === zhiWx) return "子孫";
    return "妻財";
  }

  function najiaZhi(lowerTri, upperTri) {
    const low = NAJIA[lowerTri]?.l || ["","",""];
    const up = NAJIA[upperTri]?.u || ["","",""];
    return [...low, ...up];
  }

  function compHex(yaos) {
    const ls = yaos.map(y => y.l);
    const ch = yaos.map(y => y.v === 9 ? 0 : y.v === 6 ? 1 : y.l);
    const lo = getTri(ls.slice(0, 3));
    const up = getTri(ls.slice(3, 6));
    const lc = getTri(ch.slice(0, 3));
    const uc = getTri(ch.slice(3, 6));
    const on = HEX_T[lo + up] || "?";
    const cn = HEX_T[lc + uc] || "?";
    const mv = yaos.map((y, i) => y.m ? i : -1).filter(i => i >= 0);
    const oZhi = najiaZhi(lo, up);
    const cZhi = najiaZhi(lc, uc);
    const pal = PALACE[on] || null;
    const palWx = pal ? TRI_WX[pal.p] : null;
    const ganList = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const dayGan = ganList[new Date().getDate() % 10];
    const shen = LIUSHEN[dayGan] || null;

    const lines = yaos.map((y, i) => {
      const z = oZhi[i] || "";
      const zwx = ZHI_WX[z] || "";
      const lq = palWx && zwx ? liuqin(palWx, zwx) : "";
      const sh = shen ? shen[i] : "";
      const role = pal ? (pal.s === i + 1 ? "世" : pal.r === i + 1 ? "應" : "") : "";
      let cZ = "", cLq = "";
      if (y.m) {
        cZ = cZhi[i] || "";
        const cWx = ZHI_WX[cZ] || "";
        cLq = palWx && cWx ? liuqin(palWx, cWx) : "";
      }
      return { z, zwx, lq, sh, role, cZ, cLq };
    });

    return {
      o:on, oN:HEX_N[on] || 0, c:cn, cN:HEX_N[cn] || 0,
      mv, hasM:mv.length > 0, palace:pal ? pal.p : "", palaceWx:palWx || "", lines
    };
  }

  function formatYaoResult() {
    const hex = state.hex;
    const ms = hex.mv.length > 0 ? hex.mv.map(i => YN[i]).join("、") : "無";
    let t = `【六爻起卦結果】\n占問：${state.q}\n\n`;
    if (hex.palace) t += `卦宮：${hex.palace}宮（屬${hex.palaceWx}）\n`;
    t += `本卦：${hex.o}（第${hex.oN}卦）\n`;
    if (hex.hasM) t += `變卦：${hex.c}（第${hex.cN}卦）\n`;
    t += `動爻：${ms}\n\n六爻詳情（上爻→初爻）：\n`;
    for (let i = 5; i >= 0; i--) {
      const y = state.yaos[i];
      const ln = hex.lines[i];
      let row = ` ${YN[i]}`;
      if (ln.role) row += `【${ln.role}】`;
      row += ` ${ln.sh || ""} ${ln.z}${ln.zwx}`;
      if (ln.lq) row += ` ${ln.lq}`;
      row += ` ─ ${y.c.join("·")}=${y.v} ${y.t}`;
      if (y.m && ln.cZ) row += `  變→ ${ln.cZ}${ZHI_WX[ln.cZ]}${ln.cLq ? " " + ln.cLq : ""}`;
      t += row + "\n";
    }
    return t;
  }

  function bind() {
    const qInput = document.getElementById("questionInput");
    if (qInput) {
      qInput.addEventListener("input", e => {
        state.q = e.target.value.slice(0, 200);
        const count = document.getElementById("qCount");
        const btn = document.getElementById("startBtn");
        if (count) count.textContent = `${state.q.length}/200`;
        if (btn) btn.disabled = !state.q.trim();
      });
    }

    document.querySelectorAll("[data-example]").forEach(btn => btn.addEventListener("click", () => {
      state.q = btn.getAttribute("data-example");
      render();
    }));

    const start = document.getElementById("startBtn");
    if (start) start.addEventListener("click", () => {
      if (!state.q.trim()) return;
      state.selected = null;
      state.pg = "s";
      render();
    });

    document.querySelectorAll("[data-system]").forEach(btn => btn.addEventListener("click", () => {
      state.selected = btn.getAttribute("data-system");
      render();
    }));

    document.querySelectorAll("[data-count]").forEach(btn => btn.addEventListener("click", () => {
      state.cnt = Number(btn.getAttribute("data-count"));
      render();
    }));

    const next = document.getElementById("nextSystem");
    if (next) next.addEventListener("click", () => {
      if (!state.selected) return;
      state.sys = state.selected;
      if (state.sys === "liuyao") {
        Object.assign(state, {pg:"y", yaos:[], busy:false, spin:false, hex:null});
        render();
      } else {
        state.pg = "c";
        startCards();
      }
    });

    document.querySelectorAll("[data-action='back']").forEach(btn => btn.addEventListener("click", () => {
      clearTimer();
      if (state.pg === "s") state.pg = "q";
      else if (state.pg === "c" || state.pg === "y") state.pg = "s";
      else state.pg = "q";
      render();
    }));

    const resultCards = document.getElementById("resultCards");
    if (resultCards) resultCards.addEventListener("click", () => {
      state.result = formatCardResult();
      state.pg = "r";
      render();
    });

    const doOne = document.getElementById("doOne");
    if (doOne) doOne.addEventListener("click", () => {
      if (state.busy || state.yaos.length >= 6) return;
      state.busy = true;
      state.spin = true;
      render();
      timer = setTimeout(() => {
        state.yaos.push(tossYao());
        state.busy = false;
        state.spin = false;
        if (state.yaos.length === 6) state.hex = compHex(state.yaos);
        render();
      }, 520);
    });

    const doAll = document.getElementById("doAll");
    if (doAll) doAll.addEventListener("click", () => {
      if (state.busy) return;
      state.busy = true;
      state.spin = true;
      render();
      timer = setTimeout(() => {
        state.yaos = Array.from({length:6}, () => tossYao());
        state.hex = compHex(state.yaos);
        state.busy = false;
        state.spin = false;
        render();
      }, 700);
    });

    const resetYao = document.getElementById("resetYao");
    if (resetYao) resetYao.addEventListener("click", () => {
      clearTimer();
      Object.assign(state, {yaos:[], busy:false, spin:false, hex:null});
      render();
    });

    const resultYao = document.getElementById("resultYao");
    if (resultYao) resultYao.addEventListener("click", () => {
      state.result = formatYaoResult();
      state.pg = "r";
      render();
    });

    const copyResult = document.getElementById("copyResult");
    if (copyResult) copyResult.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(state.result);
        } else {
          const ta = document.createElement("textarea");
          ta.value = state.result;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        state.copied = true;
        render();
        setTimeout(() => { state.copied = false; render(); }, 1800);
      } catch (e) {
        alert("複製失敗，請手動選取文字。");
      }
    });

    const restart = document.getElementById("restart");
    if (restart) restart.addEventListener("click", goQuestion);
  }

  render();
})();
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>愛之謎 Mistero d'Amore</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#f3f0ea;
  color:#2c2c2c;
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  -webkit-font-smoothing:antialiased;
}
button,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{min-height:100vh;display:flex;justify-content:center;background:#f3f0ea}
.app{width:100%;max-width:420px;min-height:100vh;position:relative;padding:76px 24px 40px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:300;font-style:italic;letter-spacing:2px}
.divider{width:36px;height:1px;background:#ccc8c0;margin:14px auto}
.center{text-align:center}
.muted{color:#888}
.tiny{font-size:11px;color:#aaa;letter-spacing:4px}
.panel{
  background:#fff;
  border:1px solid #ddd9d2;
  border-radius:14px;
  box-shadow:0 1px 10px rgba(0,0,0,.04);
}
textarea{
  width:100%;
  border:1px solid #ddd9d2;
  border-radius:8px;
  padding:14px 16px;
  font-size:15px;
  line-height:1.9;
  resize:none;
  background:#faf8f5;
  color:#2c2c2c;
}
textarea:focus{outline:none;border-color:#6b8f71;box-shadow:0 0 0 3px rgba(107,143,113,.08)}
.primary{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:8px;
  background:#6b8f71;
  color:white;
  font-size:14px;
  letter-spacing:5px;
  box-shadow:0 2px 10px rgba(107,143,113,.18);
}
.primary:disabled{background:#ddd9d2;color:#aaa;box-shadow:none}
.ghost{
  width:100%;
  padding:14px 0;
  border:1px solid #ddd9d2;
  border-radius:8px;
  background:transparent;
  color:#888;
  font-size:13px;
  letter-spacing:3px;
}
.back{
  position:absolute;
  top:18px;
  left:20px;
  border:none;
  background:transparent;
  color:#888;
  font-size:13px;
  letter-spacing:2px;
  padding:8px 0;
}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 30px}
.chip{
  border:none;
  border-radius:20px;
  background:#eaf1eb;
  color:#4a6b4e;
  padding:6px 13px;
  font-size:11px;
}
.sys{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:16px 18px;
  margin-bottom:9px;
  border:1px solid #ddd9d2;
  border-radius:10px;
  background:#fff;
  text-align:left;
  position:relative;
}
.sys.active{background:#eaf1eb;border:1.5px solid #6b8f71}
.icon{
  width:38px;
  height:38px;
  border-radius:8px;
  background:#faf8f5;
  color:#888;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}
.sys.active .icon{background:#6b8f71;color:#fff}
.tag{
  position:absolute;
  right:14px;
  top:10px;
  font-size:9px;
  color:#b8956a;
  border:1px solid #d4b896;
  border-radius:4px;
  padding:2px 9px;
}
.counts{display:flex;gap:10px;margin:10px 0 24px}
.count{
  flex:1;
  border:1px solid #ddd9d2;
  border-radius:8px;
  background:#fff;
  padding:13px 0;
}
.count.active{background:#eaf1eb;border:1.5px solid #6b8f71}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:32px 0}
.card{
  width:98px;
  height:152px;
  border-radius:10px;
  background:#fff;
  border:1px solid #ddd9d2;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  text-align:center;
  animation:pop .35s ease both;
  position:relative;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) rotateY(90deg)}to{opacity:1;transform:translateY(0) rotateY(0)}}
.card.back{
  background:linear-gradient(155deg,#6b8f71,#4a6b4e);
  color:rgba(255,255,255,.35);
  font-size:20px;
}
.rev{color:#c07070;font-size:10px;margin-bottom:8px}
.up{color:#6b8f71;font-size:10px;margin-bottom:8px}
.coinrow{display:flex;justify-content:center;gap:14px;margin:22px 0}
.coin{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#e8d5a8,#c9a96e 50%,#a07840);
  box-shadow:0 2px 6px rgba(160,120,64,.3),inset 0 1px 2px rgba(255,255,255,.35);
}
.spin{animation:spin .75s ease}
@keyframes spin{from{transform:rotateY(0) translateY(0)}50%{transform:rotateY(540deg) translateY(-14px)}to{transform:rotateY(720deg) translateY(0)}}
.yaoBox{
  background:#fff;
  border:1px solid #ddd9d2;
  border-radius:12px;
  padding:16px 14px;
  margin:20px 0;
}
.yao{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #f3efe8;
  font-size:12px;
}
.yao:last-child{border-bottom:none}
.line{display:flex;gap:4px;align-items:center}
.solid{width:48px;height:7px;background:#6b8f71;border-radius:2px}
.broken{width:21px;height:7px;background:#6b8f71;border-radius:2px}
.move .solid,.move .broken{background:#b8956a}
.result{
  white-space:pre-wrap;
  background:#fff;
  border:1px solid #ddd9d2;
  border-radius:12px;
  padding:22px;
  font-size:12px;
  line-height:1.95;
  color:#555;
  margin-bottom:22px;
}
</style>
</head>

<body>
<div id="root"></div>

<script>
const root = document.getElementById("root");

const major = ["愚者","魔術師","女祭司","女皇","皇帝","教皇","戀人","戰車","力量","隱者","命運之輪","正義","倒吊人","死神","節制","惡魔","高塔","星星","月亮","太陽","審判","世界"];
const nums = ["王牌","二","三","四","五","六","七","八","九","十","侍者","騎士","王后","國王"];
const suits = ["權杖","聖杯","寶劍","錢幣"];
const tarot = major.concat(suits.flatMap(s => nums.map(n => s + n)));
const lenormand = ["1 騎士","2 幸運草","3 船","4 房屋","5 樹","6 雲","7 蛇","8 棺材","9 花束","10 鐮刀","11 鞭子","12 鳥","13 孩子","14 狐狸","15 熊","16 星星","17 鸛","18 狗","19 塔","20 花園","21 山","22 道路","23 老鼠","24 心","25 戒指","26 書","27 信","28 男人","29 女人","30 百合","31 太陽","32 月亮","33 鑰匙","34 魚","35 錨","36 十字架"];
const hexNames = ["乾","坤","屯","蒙","需","訟","師","比","小畜","履","泰","否","同人","大有","謙","豫","隨","蠱","臨","觀","噬嗑","賁","剝","復","無妄","大畜","頤","大過","坎","離","咸","恆","遁","大壯","晉","明夷","家人","睽","蹇","解","損","益","夬","姤","萃","升","困","井","革","鼎","震","艮","漸","歸妹","豐","旅","巽","兌","渙","節","中孚","小過","既濟","未濟"];
const yaoNames = ["初爻","二爻","三爻","四爻","五爻","上爻"];

let state = {
  page: "question",
  question: "",
  system: "",
  count: 3,
  cards: [],
  yaos: [],
  result: "",
  busy: false
};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function suggest(q){
  const choose = ["該不該","要不要","是不是","會不會","還是","選","可不可以","有沒有","能不能","好不好","對不對","值不值"];
  const future = ["會怎樣","怎麼樣","最後","結果","成不成","發展","走向","未來會","後來","結局","下場"];
  if(choose.some(k => q.includes(k))) return "lenormand";
  if(future.some(k => q.includes(k))) return "liuyao";
  return "tarot";
}

function shell(html){
  root.innerHTML = `<div class="wrap"><main class="app">${html}</main></div>`;
  bind();
}

function questionPage(){
  shell(`
    <div class="center">
      <div class="tiny">愛之謎</div>
      <h1 style="font-size:32px;margin-top:18px;">Mistero d'Amore</h1>
      <div class="divider"></div>
      <p class="muted" style="font-size:12.5px;line-height:2.2;letter-spacing:1px;">將心中所念化為文字<br>天地自有感應</p>
    </div>

    <div class="panel" style="padding:20px;margin-top:36px;">
      <textarea id="q" rows="4" maxlength="200" placeholder="輸入你想問的事⋯⋯">${esc(state.question)}</textarea>
      <div id="qCount" class="muted" style="text-align:right;font-size:10px;margin-top:6px;">${state.question.length}/200</div>
    </div>

    <div class="chips">
      ${["她現在對我什麼感覺？","我們還有機會嗎？","該不該跟她告白？","我跟她最後會怎樣？"].map(x => `<button class="chip" data-example="${esc(x)}">${esc(x)}</button>`).join("")}
    </div>

    <button class="primary" id="start" ${state.question.trim() ? "" : "disabled"}>開 始 占 卜</button>
  `);
}

function systemPage(){
  const rec = suggest(state.question);
  const systems = [
    ["tarot","塔 羅","78張完整牌組・正逆位","✦"],
    ["lenormand","雷 諾 曼","36張指引牌","◇"],
    ["liuyao","六 爻","銅錢起卦・本卦變卦","☰"]
  ];

  shell(`
    <button class="back" data-back>← 返回</button>

    <div class="center">
      <h1 style="font-size:26px;">Metodo</h1>
      <div class="divider"></div>
    </div>

    <div style="background:#fff;border-left:3px solid #c5d8c7;border-radius:10px;padding:12px 16px;margin:34px 0 24px;font-size:13px;line-height:1.8;color:#555;">
      「${esc(state.question.length > 35 ? state.question.slice(0,35) + "⋯" : state.question)}」
    </div>

    ${systems.map(([id,name,sub,icon]) => `
      <button class="sys ${state.system === id ? "active" : ""}" data-sys="${id}">
        <span class="icon">${icon}</span>
        <span>
          <div style="font-size:14px;letter-spacing:3px;font-weight:500;">${name}</div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${sub}</div>
        </span>
        ${rec === id ? `<span class="tag">推薦</span>` : ""}
      </button>
    `).join("")}

    ${(state.system === "tarot" || state.system === "lenormand") ? `
      <div style="font-size:11px;color:#888;letter-spacing:3px;margin-top:22px;">抽 牌 數 量</div>
      <div class="counts">
        <button class="count ${state.count === 3 ? "active" : ""}" data-count="3">
          <div style="font-size:18px;">3</div>
          <div class="muted" style="font-size:10px;margin-top:3px;">快速解讀</div>
        </button>
        <button class="count ${state.count === 5 ? "active" : ""}" data-count="5">
          <div style="font-size:18px;">5</div>
          <div class="muted" style="font-size:10px;margin-top:3px;">深入分析</div>
        </button>
      </div>
    ` : `<div style="height:24px;"></div>`}

    <button class="primary" id="next" ${state.system ? "" : "disabled"}>下 一 步</button>
  `);
}

function drawCards(){
  const source = state.system === "tarot" ? tarot : lenormand;
  state.cards = shuffle(source).slice(0, state.count).map(name => ({
    name,
    reversed: state.system === "tarot" && Math.random() < 0.5
  }));
  state.page = "cards";
  render();
}

function cardsPage(){
  const title = state.system === "tarot" ? "Tarocchi" : "Lenormand";
  shell(`
    <button class="back" data-back>← 返回</button>

    <div class="center">
      <h1 style="font-size:24px;">${title}</h1>
      <div class="muted" style="font-size:11px;margin-top:8px;letter-spacing:2px;">牌面已開</div>
    </div>

    <div class="cards">
      ${state.cards.map((c,i) => `
        <div class="card" style="animation-delay:${i * 90}ms;">
          ${state.system === "tarot" ? `<div class="${c.reversed ? "rev" : "up"}">${c.reversed ? "逆位" : "正位"}</div>` : ""}
          <div style="font-size:14px;line-height:1.6;letter-spacing:1px;${c.reversed ? "transform:rotate(180deg)" : ""}">${esc(c.name)}</div>
          ${state.system === "tarot" && major.includes(c.name) ? `<div style="position:absolute;bottom:8px;font-size:8px;color:#b8956a;">大秘儀</div>` : ""}
        </div>
      `).join("")}
    </div>

    <button class="primary" id="cardResult">Risultato</button>
  `);
}

function cardResult(){
  const name = state.system === "tarot" ? "塔羅" : "雷諾曼";
  const list = state.cards.map(c => state.system === "tarot" ? `${c.reversed ? "逆位" : "正位"}${c.name}` : c.name);
  state.result = `【${name}${state.count}張牌結果】\n占問：${state.question}\n\n牌面：${list.join("、")}`;
  state.page = "result";
  render();
}

function tossYao(){
  const coins = [
    Math.random() < 0.5 ? "正" : "反",
    Math.random() < 0.5 ? "正" : "反",
    Math.random() < 0.5 ? "正" : "反"
  ];
  const heads = coins.filter(x => x === "正").length;
  if(heads === 3) return {coins, value:9, line:1, moving:true, text:"老陽（動）"};
  if(heads === 2) return {coins, value:8, line:0, moving:false, text:"少陰"};
  if(heads === 1) return {coins, value:7, line:1, moving:false, text:"少陽"};
  return {coins, value:6, line:0, moving:true, text:"老陰（動）"};
}

function hexIndex(yaos){
  let n = 0;
  yaos.forEach((y,i) => {
    if(y.line) n += Math.pow(2,i);
  });
  return n % 64;
}

function changedHexIndex(yaos){
  let n = 0;
  yaos.forEach((y,i) => {
    let line = y.line;
    if(y.value === 9) line = 0;
    if(y.value === 6) line = 1;
    if(line) n += Math.pow(2,i);
  });
  return n % 64;
}

function liuyaoPage(){
  const complete = state.yaos.length === 6;
  const h1 = complete ? hexNames[hexIndex(state.yaos)] : "";
  const h2 = complete ? hexNames[changedHexIndex(state.yaos)] : "";
  const moving = state.yaos.map((y,i) => y.moving ? yaoNames[i] : null).filter(Boolean);

  shell(`
    <button class="back" data-back>← 返回</button>

    <div class="center">
      <h1 style="font-size:24px;">Sei Linee</h1>
      <div class="muted" style="font-size:12px;margin-top:6px;letter-spacing:3px;">六 爻 起 卦</div>
      <div class="muted" style="font-size:11px;margin-top:5px;letter-spacing:2px;">${complete ? "卦象已成" : `第 ${state.yaos.length + 1} 爻 / 共 6 爻`}</div>
    </div>

    ${!complete ? `
      <div class="coinrow">
        <div class="coin ${state.busy ? "spin" : ""}"></div>
        <div class="coin ${state.busy ? "spin" : ""}"></div>
        <div class="coin ${state.busy ? "spin" : ""}"></div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <button class="primary" id="one" ${state.busy ? "disabled" : ""} style="flex:1;">擲 銅 錢</button>
        <button class="ghost" id="all" ${state.busy ? "disabled" : ""} style="flex:1;">一 鍵 六 爻</button>
      </div>
      ${state.yaos.length ? `<button id="reset" style="border:none;background:none;color:#aaa;font-size:11px;width:100%;margin-bottom:8px;">← 重擲</button>` : ""}
    ` : ""}

    ${state.yaos.length ? `
      <div class="yaoBox">
        ${[...state.yaos].reverse().map((y,ri) => {
          const i = state.yaos.length - 1 - ri;
          return `
            <div class="yao ${y.moving ? "move" : ""}">
              <span style="width:36px;color:#888;">${yaoNames[i]}</span>
              <span class="line">
                ${y.line ? `<span class="solid"></span>` : `<span class="broken"></span><span class="broken"></span>`}
              </span>
              <span style="font-size:11px;color:${y.moving ? "#b8956a" : "#888"};">${y.text}</span>
            </div>
          `;
        }).join("")}
      </div>
    ` : ""}

    ${complete ? `
      <div class="panel center" style="padding:22px 20px;margin-bottom:22px;border-color:#c5d8c7;">
        <div class="tiny" style="margin-bottom:14px;">Responso</div>
        <div style="font-size:26px;letter-spacing:6px;">${h1}</div>
        <div class="muted" style="font-size:12px;margin-top:4px;">本卦</div>
        ${moving.length ? `
          <div style="width:1px;height:20px;background:#ddd9d2;margin:12px auto;"></div>
          <div style="font-size:10px;color:#aaa;letter-spacing:3px;margin-bottom:6px;">變 卦</div>
          <div style="font-size:26px;letter-spacing:6px;color:#b8956a;">${h2}</div>
          <div style="margin-top:14px;padding:6px 14px;background:#eaf1eb;border-radius:6px;display:inline-block;font-size:11px;color:#4a6b4e;letter-spacing:2px;">動爻：${moving.join("、")}</div>
        ` : `<div style="margin-top:14px;font-size:11px;color:#888;">動爻：無</div>`}
      </div>
      <button class="primary" id="yaoResult">Risultato</button>
    ` : ""}
  `);
}

function liuyaoResult(){
  const h1 = hexNames[hexIndex(state.yaos)];
  const h2 = hexNames[changedHexIndex(state.yaos)];
  const moving = state.yaos.map((y,i) => y.moving ? yaoNames[i] : null).filter(Boolean);

  let text = `【六爻起卦結果】\n占問：${state.question}\n\n本卦：${h1}\n`;
  if(moving.length) text += `變卦：${h2}\n`;
  text += `動爻：${moving.length ? moving.join("、") : "無"}\n\n六爻詳情（上爻→初爻）：\n`;

  for(let i = 5; i >= 0; i--){
    const y = state.yaos[i];
    text += `${yaoNames[i]}：${y.coins.join("·")} = ${y.value}，${y.text}\n`;
  }

  state.result = text;
  state.page = "result";
  render();
}

function resultPage(){
  shell(`
    <div class="center">
      <h1 style="font-size:24px;">Responso</h1>
      <div class="divider"></div>
    </div>

    <div class="result">${esc(state.result)}</div>

    <div style="display:flex;gap:10px;">
      <button class="primary" id="copy" style="flex:1;letter-spacing:3px;">Copia</button>
      <button class="ghost" id="again" style="flex:1;">Di Nuovo</button>
    </div>
  `);
}

function render(){
  if(state.page === "question") questionPage();
  if(state.page === "system") systemPage();
  if(state.page === "cards") cardsPage();
  if(state.page === "liuyao") liuyaoPage();
  if(state.page === "result") resultPage();
}

function bind(){
  const q = document.getElementById("q");
  if(q){
    q.addEventListener("input", e => {
      state.question = e.target.value.slice(0,200);
      document.getElementById("qCount").textContent = `${state.question.length}/200`;
      document.getElementById("start").disabled = !state.question.trim();
    });
  }

  document.querySelectorAll("[data-example]").forEach(btn => {
    btn.onclick = () => {
      state.question = btn.dataset.example;
      render();
    };
  });

  const start = document.getElementById("start");
  if(start){
    start.onclick = () => {
      if(!state.question.trim()) return;
      state.system = "";
      state.page = "system";
      render();
    };
  }

  document.querySelectorAll("[data-sys]").forEach(btn => {
    btn.onclick = () => {
      state.system = btn.dataset.sys;
      render();
    };
  });

  document.querySelectorAll("[data-count]").forEach(btn => {
    btn.onclick = () => {
      state.count = Number(btn.dataset.count);
      render();
    };
  });

  const next = document.getElementById("next");
  if(next){
    next.onclick = () => {
      if(!state.system) return;
      if(state.system === "liuyao"){
        state.yaos = [];
        state.page = "liuyao";
        render();
      }else{
        drawCards();
      }
    };
  }

  document.querySelectorAll("[data-back]").forEach(btn => {
    btn.onclick = () => {
      if(state.page === "system") state.page = "question";
      else state.page = "system";
      render();
    };
  });

  const cardBtn = document.getElementById("cardResult");
  if(cardBtn) cardBtn.onclick = cardResult;

  const one = document.getElementById("one");
  if(one){
    one.onclick = () => {
      if(state.busy || state.yaos.length >= 6) return;
      state.busy = true;
      render();
      setTimeout(() => {
        state.yaos.push(tossYao());
        state.busy = false;
        render();
      }, 500);
    };
  }

  const all = document.getElementById("all");
  if(all){
    all.onclick = () => {
      if(state.busy) return;
      state.busy = true;
      render();
      setTimeout(() => {
        state.yaos = Array.from({length:6}, tossYao);
        state.busy = false;
        render();
      }, 650);
    };
  }

  const reset = document.getElementById("reset");
  if(reset){
    reset.onclick = () => {
      state.yaos = [];
      state.busy = false;
      render();
    };
  }

  const yaoBtn = document.getElementById("yaoResult");
  if(yaoBtn) yaoBtn.onclick = liuyaoResult;

  const copy = document.getElementById("copy");
  if(copy){
    copy.onclick = async () => {
      try{
        await navigator.clipboard.writeText(state.result);
        copy.textContent = "Copiato ✓";
      }catch(e){
        alert("複製失敗，請手動選取文字。");
      }
    };
  }

  const again = document.getElementById("again");
  if(again){
    again.onclick = () => {
      state = {
        page: "question",
        question: "",
        system: "",
        count: 3,
        cards: [],
        yaos: [],
        result: "",
        busy: false
      };
      render();
    };
  }
}

try{
  render();
}catch(e){
  root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#666;line-height:1.8;">網頁發生錯誤，請重新整理。<br><small>${esc(e.message)}</small></div>`;
}
</script>
</body>
</html>

function suggest(q) {

function shuf(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

  const cnt = { "♥":0, "♦":0, "♣":0, "♠":0 };
  cards.forEach(c => cnt[c.suit]++);
  const sp = cnt["♠"];
  let tone;
  if (sp === 0) tone = "牌裡沒有黑桃，整體走向偏順利，可以放心往前。";
  else if (sp >= Math.ceil(n / 2)) tone = "黑桃佔了多數，這段時間阻礙較多。先處理眼前的問題，別急著做大決定。";
  else {
    const top = Object.entries(cnt).filter(([k]) => k !== "♠").sort((a, b) => b[1] - a[1]);
    if (top[0][1] === top[1][1]) tone = "花色分布平均，局面比較複雜，需要在感情、現實與思考之間取得平衡。";
    else tone = { "♥":"紅心最多，這件事的核心在感情與人際，跟著真心走。",
                  "♦":"方塊最多，事情會有實際的變動，留意消息與機會。",
                  "♣":"梅花最多，關鍵在於規劃與溝通，想清楚再行動。" }[top[0][0]]
         + "其中的黑桃提醒你留意一個小阻礙。";
  }
  return `這組牌從「${cards[0].name}」開始，最後落在「${cards[n-1].name}」。${tone}試著把相鄰的牌連起來看，例如「${cards[0].name}＋${cards[1].name}」，往往會浮現和你的問題最貼近的畫面。`;
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

/* ═══ CARD DRAW ═══ */
function PageC({ system, cnt, question, onResult, onBack }) {
  const [cards] = useState(() => system === "tarot" ? drawT(cnt) : system === "sibilla" ? drawS(cnt) : drawL(cnt));
  const [phase, setPhase] = useState("shuffle");
  const [open, setOpen] = useState([]);
  const [auto, setAuto] = useState(false);
  const tmrs = useRef([]);
  const later = (fn, ms) => { tmrs.current.push(setTimeout(fn, ms)); };

  useEffect(() => {
    later(() => setPhase("deal"), 1700);
    return () => tmrs.current.forEach(clearTimeout);
  }, []);

  const isSib = system === "sibilla";
  const sm = cnt > 3;
  const done = open.length === cnt;

  function reveal(i) { buzz(8); setOpen(p => p.includes(i) ? p : [...p, i]); }
  function flip(i) { if (phase === "shuffle" || open.includes(i)) return; reveal(i); }
  function flipAll() {
    setAuto(true);
    cards.map((_, i) => i).filter(i => !open.includes(i)).forEach((i, k) => later(() => reveal(i), k * 280));
  }

  function fmt() {
    if (isSib) {
      let t = `【西比拉卡${cnt}張牌結果】\n占問：${question}\n\n`;
      cards.forEach((c, i) => { t += `第${POS_CN[i]}張 ${c.suit} ${c.name} ${c.it}\n${c.mean}\n\n`; });
      return t + `總結：${sibSummary(cards)}`;
    }
    const sn = system === "tarot" ? "塔羅" : "雷諾曼";
    return `【${sn}${cnt}張牌結果】\n占問：${question}\n\n牌面：${cards.map(c => cardLabel(c, system)).join("、")}`;
  }
  function finish() {
    onResult({ text: fmt(), system, cards, question, summary: isSib ? sibSummary(cards) : null });
  }

  const rows = sm ? [[0, 1, 2], [3, 4]] : [[0, 1, 2]];
  const slot = i => {
    const on = open.includes(i);
    return (
      <div key={i} className={"slot" + (on ? " on" : "")}>
        <button className={"tcard" + (sm ? " sm" : "") + (on ? " on" : "")} style={{ animationDelay:`${i * 0.13}s` }} onClick={() => flip(i)}
          aria-label={on ? `第${POS_CN[i]}張：${cardLabel(cards[i], system)}` : `翻開第${POS_CN[i]}張牌`}>
          <div className="tc-in">
            <CardBack system={system} />
            <div className="side face"><CardFace c={cards[i]} system={system} sm={sm} /></div>
          </div>
        </button>
        <div className="pos">第{POS_CN[i]}張</div>
      </div>
    );
  };

  return (<>
    <TopBar onBack={onBack} step={2} />
    <div className="page">
      <Head it={SYS_IT[system]} zh={SYS_ZH[system]} />
      {phase === "shuffle" ? (
        <div style={{ animation:"fadeIn .4s ease" }}>
          <div className="deck" aria-hidden="true">
            <div className="d0"><CardBack system={system} /></div>
            <div className="d1"><CardBack system={system} /></div>
            <div className="d2"><CardBack system={system} /></div>
          </div>
          <div className="wait">靜心洗牌</div>
          <div style={{ textAlign:"center", fontSize:12, color:"var(--faint)", marginTop:16, lineHeight:1.9, padding:"0 12px" }}>
            默念：{question.length > 40 ? question.slice(0, 40) + "⋯" : question}
          </div>
        </div>
      ) : (<>
        <div className="spread">{rows.map((r, k) => <div className="row" key={k}>{r.map(slot)}</div>)}</div>
        {!done ? (
          <div style={{ textAlign:"center", animation:`fadeIn .6s ease ${cnt * 0.13 + 0.3}s both` }}>
            <div className="hint">輕觸牌面，逐一翻開　<span style={{ color:"var(--faint)", fontVariantNumeric:"tabular-nums" }}>{open.length} / {cnt}</span></div>
            {!auto && <button className="link" onClick={flipAll}>全部翻開</button>}
          </div>
        ) : (
          <div style={{ animation:"slideUp .5s ease .6s both" }}>
            <div className="hint" style={{ marginBottom:18, color:"var(--gold)" }}>✦　牌面已開　✦</div>
            <PBtn onClick={finish}>Risultato</PBtn>
          </div>
        )}
      </>)}
    </div>
  </>);
}

/* ═══ LIU YAO ═══ */
function PageY({ question, onResult, onBack }) {
  const [yaos, setYaos] = useState([]);
  const [busy, setBusy] = useState(false);
  const [cur, setCur] = useState(0);
  const [hex, setHex] = useState(null);
  const [spin, setSpin] = useState(false);

  function doOne() {
    if (cur >= 6 || busy) return;
    setBusy(true); setSpin(true);
    setTimeout(() => {
      setSpin(false);
      const y = tossYao();
      const ny = [...yaos, y];
      setYaos(ny); setCur(p => p + 1); setBusy(false); buzz(12);
      if (ny.length === 6) setHex(compHex(ny));
    }, 700);
  }
  function doAll() {
    if (busy) return;
    setBusy(true);
    const all = []; let i = 0;
    function next() {
      if (i >= 6) { setBusy(false); setSpin(false); setHex(compHex(all)); return; }
      setSpin(true);
      setTimeout(() => {
        all.push(tossYao()); buzz(8);
        setYaos([...all]); setCur(all.length);
        setSpin(false); i++;
        setTimeout(next, 250);
      }, 500);
    }
    next();
  }
  const last = yaos.length ? yaos[yaos.length - 1] : null;
  function reset() { setYaos([]); setCur(0); setHex(null); }

  function fmt() {
    const ms = hex.mv.length > 0 ? hex.mv.map(i => YN[i]).join("、") : "無";
    let t = `【六爻起卦結果】\n占問：${question}\n\n`;
    if (hex.bazi) t += `四柱：${hex.bazi.y}年 ${hex.bazi.m}月 ${hex.bazi.d}日 ${hex.bazi.h}時\n`;
    if (hex.palace) t += `卦宮：${hex.palace}宮（屬${hex.palaceWx}）\n`;
    t += `本卦：${hex.o}（第${hex.oN}卦）\n`;
    if (hex.hasM) t += `變卦：${hex.c}（第${hex.cN}卦）\n`;
    t += `動爻：${ms}\n\n六爻詳情（上爻→初爻）：\n`;
    for (let i = 5; i >= 0; i--) {
      const y = yaos[i]; const ln = hex.lines[i];
      let row = ` ${YN[i]}`;
      if (ln.role) row += `【${ln.role}】`;
      row += ` ${ln.sh || ""} ${ln.z}${ln.zwx}`;
      if (ln.lq) row += ` ${ln.lq}`;
      row += ` ─ ${y.c.join("·")}=${y.v} ${y.t}`;
      if (y.m && ln.cZ) row += `  變→ ${ln.cZ}${ZHI_WX[ln.cZ]}${ln.cLq?" "+ln.cLq:""}`;
      t += row + "\n";
    }
    return t;
  }

  return (
    <><TopBar onBack={onBack} step={2} />
      <div className="page">
        <Head it="Sei Linee" zh="六爻起卦" />
        <div style={{ textAlign:"center", fontSize:11, color:"var(--faint)", margin:"-12px 0 26px", letterSpacing:2 }}>
          {cur < 6 ? `第 ${cur+1} 爻 / 共 6 爻` : "卦象已成"}
        </div>
        {cur < 6 && (
          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ display:"flex", justifyContent:"center", gap:18, marginBottom:22 }}>
              {[0,1,2].map(ci => (
                <div key={ci} className={`coin${spin?" spin":""}${!spin && last && last.c[ci]==="反"?" rev":""}`} style={{ animationDelay:`${ci*0.08}s` }} />
              ))}
            </div>
            {last && !spin && <div className="toss">{last.c.join(" · ")}　{last.t}</div>}
            <div style={{ display:"flex", gap:10 }}>
              <PBtn onClick={doOne} disabled={busy} style={{ flex:1 }}>擲銅錢</PBtn>
              <GBtn onClick={doAll} style={{ flex:1 }}>一鍵六爻</GBtn>
            </div>
            {cur > 0 && <button onClick={reset} style={{ background:"none", border:"none", color:"#aaa", fontSize:11, marginTop:12, letterSpacing:1, fontFamily:"'Noto Serif TC',serif" }}>← 重擲</button>}
          </div>
        )}

        {yaos.length > 0 && (
          <div style={{ background:"var(--paper)", borderRadius:12, padding:"16px 14px", marginBottom:22, boxShadow:"0 1px 8px rgba(0,0,0,0.04)", border:"1px solid var(--line)" }}>
            {hex && (
              <div style={{ display:"flex", fontSize:9, color:"#aaa", letterSpacing:1, paddingBottom:8, marginBottom:6, borderBottom:"1px dashed #eae6df", textAlign:"center" }}>
                <span style={{ width:28 }}>爻位</span>
                <span style={{ width:26 }}>六神</span>
                <span style={{ width:36 }}>地支</span>
                <span style={{ width:30 }}>六親</span>
                <span style={{ flex:1, textAlign:"left", paddingLeft:6 }}>爻象</span>
                <span style={{ width:22 }}>世應</span>
              </div>
            )}
            {[...yaos].reverse().map((y, ri) => {
              const i = yaos.length - 1 - ri;
              const ln = hex ? hex.lines[i] : null;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", padding:"7px 0", animation:"sd 0.3s ease", borderBottom:ri<yaos.length-1?"1px solid #f3efe8":"none", fontSize:10.5, color:"#555" }}>
                  <span style={{ width:28, fontSize:10, color:"#888", textAlign:"center", flexShrink:0 }}>{YN[i]}</span>
                  <span style={{ width:26, fontSize:9.5, color:"#9a8868", textAlign:"center", flexShrink:0, letterSpacing:0.5 }}>{ln ? ln.sh || "" : ""}</span>
                  <span style={{ width:36, textAlign:"center", flexShrink:0, color:"#2c2c2c", fontWeight:500 }}>
                    {ln ? <>{ln.z}<span style={{ fontSize:9, color:"#aaa", marginLeft:1 }}>{ln.zwx}</span></> : ""}
                  </span>
                  <span style={{ width:30, fontSize:10, color:"#4a6b4e", textAlign:"center", flexShrink:0, fontWeight:500 }}>{ln ? ln.lq || "" : ""}</span>
                  <div style={{ flex:1, display:"flex", alignItems:"center", gap:5, paddingLeft:6, minWidth:0 }}>
                    <div style={{ display:"flex", gap:3, alignItems:"center", flexShrink:0 }}>
                      {y.l === 1
                        ? <div style={{ width:38, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} />
                        : <><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /><div style={{ width:4 }} /><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /></>
                      }
                    </div>
                    <span style={{ fontSize:8.5, color:y.m?"#b8956a":"#aaa", whiteSpace:"nowrap" }}>{y.m?"○動":""}</span>
                  </div>
                  <span style={{ width:22, fontSize:10, fontWeight:600, color:ln && ln.role==="世"?"#b8956a":ln && ln.role==="應"?"#6b8f71":"#ccc", textAlign:"center", flexShrink:0 }}>{ln ? ln.role || "" : ""}</span>
                </div>
              );
            })}

            {hex && hex.hasM && (
              <div style={{ marginTop:10, paddingTop:10, borderTop:"1px dashed #eae6df", fontSize:10, color:"#888", lineHeight:1.9 }}>
                <div style={{ fontSize:9, color:"#b8956a", letterSpacing:2, marginBottom:4 }}>變 爻</div>
                {hex.mv.slice().reverse().map(idx => {
                  const ln = hex.lines[idx];
                  return (
                    <div key={idx} style={{ display:"flex", gap:8 }}>
                      <span style={{ color:"#999" }}>{YN[idx]}：</span>
                      <span>{ln.z}{ln.zwx}{ln.lq?" "+ln.lq:""} → {ln.cZ}{ZHI_WX[ln.cZ]}{ln.cLq?" "+ln.cLq:""}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {hex && (
          <div style={{ animation:"slideUp 0.6s ease" }}>
            <div style={{ background:"var(--paper)", borderRadius:12, padding:"22px 20px", marginBottom:22, textAlign:"center", border:"1px solid #c5d8c7", boxShadow:"0 2px 14px rgba(107,143,113,0.08)" }}>
              <div className="it" style={{ fontSize:11, color:"#aaa", letterSpacing:4, marginBottom:14, fontStyle:"italic" }}>Responso</div>

              {hex.bazi && (
                <div style={{ fontSize:10.5, color:"#888", lineHeight:1.9, marginBottom:14, letterSpacing:1 }}>
                  <div style={{ fontSize:9, color:"#b8956a", letterSpacing:3, marginBottom:4 }}>年 月 日 時</div>
                  <div>{hex.bazi.y}年・{hex.bazi.m}月</div>
                  <div>{hex.bazi.d}日・{hex.bazi.h}時</div>
                </div>
              )}

              {hex.palace && (
                <div style={{ fontSize:10.5, color:"#666", marginBottom:12, letterSpacing:2 }}>
                  {hex.palace}宮　屬{hex.palaceWx}
                </div>
              )}

              <div style={{ fontSize:26, letterSpacing:6, color:"#2c2c2c", fontWeight:500 }}>{hex.o}</div>
              <div style={{ fontSize:12, color:"#888", marginTop:4 }}>第{hex.oN}卦</div>

              {hex.hasM && (<>
                <div style={{ width:1, height:20, background:"#ddd9d2", margin:"12px auto" }} />
                <div style={{ fontSize:10, color:"#aaa", letterSpacing:3, marginBottom:6 }}>變 卦</div>
                <div style={{ fontSize:26, letterSpacing:6, color:"#b8956a", fontWeight:500 }}>{hex.c}</div>
                <div style={{ fontSize:12, color:"#888", marginTop:4 }}>第{hex.cN}卦</div>
                <div style={{ marginTop:14, padding:"6px 14px", background:"#eaf1eb", borderRadius:6, display:"inline-block", fontSize:11, color:"#4a6b4e", letterSpacing:2 }}>
                  動爻：{hex.mv.map(i => YN[i]).join("、")}
                </div>
              </>)}
            </div>
            <PBtn onClick={() => onResult({ text: fmt(), hex, yaos, question, system: "liuyao" })}>Risultato</PBtn>
          </div>
        )}
      </div></>
  );
}


/* ═══ RESULT ═══ */
function PageR({ result, onRestart }) {
  const [cp, setCp] = useState(false);
  const [showDetail, setShowDetail] = useState(false);
  const copyText = result.text || result;
  async function copy() {
    const ok = await copyToClipboard(copyText);
    buzz(10);
    setCp(ok ? "ok" : "fail");
    setTimeout(() => setCp(false), 2500);
  }

  const isLY = result.system === "liuyao" && result.hex;
  const isSB = result.system === "sibilla" && result.cards;
  const suitCnt = isSB ? SUIT_INFO.map(([s]) => result.cards.filter(c => c.suit === s).length) : [];

  return (<>
    <TopBar step={3} />
    <div className="page">
      <Head it="Responso" zh="占卜結果" />

        {isLY ? (
          <div>

            {/* 占問 */}
            <div style={{ textAlign:"center", marginBottom:28 }}>
              <div style={{ display:"inline-block", background:"#f3f0ea", borderRadius:6, padding:"9px 18px", border:"1px solid #eae6df" }}>
                <span style={{ fontSize:12, color:"#888", letterSpacing:0.5 }}>{result.question}</span>
              </div>
            </div>

            {/* 本卦 → 變卦 大字展示 */}
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:20, marginBottom:36 }}>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#aaa", letterSpacing:3, marginBottom:10 }}>本 卦</div>
                <div style={{ fontSize:36, letterSpacing:4, color:"#2c2c2c", fontWeight:500 }}>{result.hex.o}</div>
                <div style={{ fontSize:11, color:"#aaa", marginTop:6 }}>第{result.hex.oN}卦</div>
              </div>
              {result.hex.hasM && (<>
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4, paddingTop:14 }}>
                  <div style={{ width:28, height:1, background:"#ddd9d2" }} />
                  <span style={{ fontSize:10, color:"#b8956a", letterSpacing:2 }}>→</span>
                  <div style={{ width:28, height:1, background:"#ddd9d2" }} />
                </div>
                <div style={{ textAlign:"center" }}>
                  <div style={{ fontSize:9, color:"#b8956a", letterSpacing:3, marginBottom:10 }}>變 卦</div>
                  <div style={{ fontSize:36, letterSpacing:4, color:"#b8956a", fontWeight:500 }}>{result.hex.c}</div>
                  <div style={{ fontSize:11, color:"#aaa", marginTop:6 }}>第{result.hex.cN}卦</div>
                </div>
              </>)}
            </div>

            {/* 摘要卡片 */}
            <div style={{ display:"flex", gap:10, marginBottom:30 }}>
              {result.hex.palace && (
                <div style={{ flex:1, background:"var(--paper)", borderRadius:10, padding:"16px 10px", textAlign:"center", border:"1px solid #eae6df", boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
                  <div style={{ fontSize:9, color:"#aaa", letterSpacing:2, marginBottom:8 }}>卦宮</div>
                  <div style={{ fontSize:15, color:"#2c2c2c", fontWeight:500 }}>{result.hex.palace}</div>
                  <div style={{ fontSize:9, color:"#888", marginTop:4 }}>屬{result.hex.palaceWx}</div>
                </div>
              )}
              <div style={{ flex:1, background:"var(--paper)", borderRadius:10, padding:"16px 10px", textAlign:"center", border:"1px solid #eae6df", boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
                <div style={{ fontSize:9, color:"#aaa", letterSpacing:2, marginBottom:8 }}>動爻</div>
                <div style={{ fontSize:15, color:"#b8956a", fontWeight:500 }}>{result.hex.mv.length > 0 ? result.hex.mv.map(i => YN[i]).join("、") : "無"}</div>
              </div>
              {result.hex.bazi && (
                <div style={{ flex:1, background:"var(--paper)", borderRadius:10, padding:"16px 10px", textAlign:"center", border:"1px solid #eae6df", boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
                  <div style={{ fontSize:9, color:"#aaa", letterSpacing:2, marginBottom:8 }}>日柱</div>
                  <div style={{ fontSize:15, color:"#2c2c2c", fontWeight:500 }}>{result.hex.bazi.d}</div>
                </div>
              )}
            </div>

            {/* 可展開的六爻詳情 */}
            <button onClick={() => setShowDetail(!showDetail)} style={{ width:"100%", padding:"16px 18px", background:"var(--paper)", border:"1px solid #eae6df", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:showDetail?0:30, borderBottomLeftRadius:showDetail?0:10, borderBottomRightRadius:showDetail?0:10, boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
              <span style={{ fontSize:12, color:"#888", letterSpacing:2 }}>六 爻 詳 情</span>
              <span style={{ fontSize:11, color:"#aaa", transition:"transform 0.3s", transform:showDetail?"rotate(180deg)":"rotate(0deg)" }}>▼</span>
            </button>
            {showDetail && (
              <div style={{ background:"var(--paper)", borderTop:"1px dashed #eae6df", borderLeft:"1px solid #eae6df", borderRight:"1px solid #eae6df", borderBottom:"1px solid #eae6df", borderBottomLeftRadius:10, borderBottomRightRadius:10, padding:"16px 14px", marginBottom:30, animation:"sd 0.3s ease", boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
                {/* 四柱完整 */}
                {result.hex.bazi && (
                  <div style={{ fontSize:10, color:"#888", textAlign:"center", marginBottom:14, lineHeight:1.8, letterSpacing:1 }}>
                    {result.hex.bazi.y}年・{result.hex.bazi.m}月・{result.hex.bazi.d}日・{result.hex.bazi.h}時
                  </div>
                )}
                {/* 表格 */}
                <div style={{ display:"flex", fontSize:9, color:"#aaa", letterSpacing:1, paddingBottom:10, marginBottom:8, borderBottom:"1px dashed #eae6df", textAlign:"center" }}>
                  <span style={{ width:28 }}>爻位</span>
                  <span style={{ width:26 }}>六神</span>
                  <span style={{ width:36 }}>地支</span>
                  <span style={{ width:30 }}>六親</span>
                  <span style={{ flex:1, textAlign:"left", paddingLeft:6 }}>爻象</span>
                  <span style={{ width:22 }}>世應</span>
                </div>
                {[...result.yaos].reverse().map((y, ri) => {
                  const i = result.yaos.length - 1 - ri;
                  const ln = result.hex.lines[i];
                  return (
                    <div key={i} style={{ display:"flex", alignItems:"center", padding:"9px 0", borderBottom:ri<result.yaos.length-1?"1px solid #f3efe8":"none", fontSize:10.5, color:"#555" }}>

                        {ln ? <>{ln.z}<span style={{ fontSize:9, color:"#aaa", marginLeft:1 }}>{ln.zwx}</span></> : ""}
                      </span>
                      <span style={{ width:30, fontSize:10, color:"#4a6b4e", textAlign:"center", flexShrink:0, fontWeight:500 }}>{ln ? ln.lq || "" : ""}</span>
                      <div style={{ flex:1, display:"flex", alignItems:"center", gap:5, paddingLeft:6, minWidth:0 }}>
                        <div style={{ display:"flex", gap:3, alignItems:"center", flexShrink:0 }}>
                          {y.l === 1
                            ? <div style={{ width:38, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} />
                            : <><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /><div style={{ width:4 }} /><div style={{ width:16, height:7, background:y.m?"#b8956a":"#6b8f71", borderRadius:2 }} /></>
                          }
                        </div>
                        <span style={{ fontSize:8.5, color:y.m?"#b8956a":"#aaa", whiteSpace:"nowrap" }}>{y.m?"○動":""}</span>
                      </div>
                      <span style={{ width:22, fontSize:10, fontWeight:600, color:ln && ln.role==="世"?"#b8956a":ln && ln.role==="應"?"#6b8f71":"#ccc", textAlign:"center", flexShrink:0 }}>{ln ? ln.role || "" : ""}</span>
                    </div>
                  );
                })}
                {result.hex.hasM && (
                  <div style={{ marginTop:14, paddingTop:14, borderTop:"1px dashed #eae6df", fontSize:10, color:"#888", lineHeight:2.0 }}>
                    <div style={{ fontSize:9, color:"#b8956a", letterSpacing:2, marginBottom:6 }}>變 爻</div>
                    {result.hex.mv.slice().reverse().map(idx => {
                      const ln = result.hex.lines[idx];
                      return (
                        <div key={idx} style={{ display:"flex", gap:8, marginBottom:2 }}>
                          <span style={{ color:"#999" }}>{YN[idx]}：</span>
                          <span>{ln.z}{ln.zwx}{ln.lq?" "+ln.lq:""} → {ln.cZ}{ZHI_WX[ln.cZ]}{ln.cLq?" "+ln.cLq:""}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        ) : isSB ? (
          <div>

            {/* 占問 */}
            <div style={{ textAlign:"center", marginBottom:24 }}>
              <div style={{ display:"inline-block", background:"#f3f0ea", borderRadius:6, padding:"9px 18px", border:"1px solid #eae6df" }}>
                <span style={{ fontSize:12, color:"#888", letterSpacing:0.5 }}>{result.question}</span>
              </div>
            </div>

            {/* 花色分布 */}
            <div style={{ display:"flex", gap:8, marginBottom:24 }}>
              {SUIT_INFO.map(([s, n], i) => (
                <div key={s} style={{ flex:1, background:"var(--paper)", borderRadius:10, padding:"12px 4px", textAlign:"center", border:"1px solid #eae6df", boxShadow:"0 1px 4px rgba(0,0,0,0.03)", opacity:suitCnt[i] ? 1 : 0.55 }}>
                  <div style={{ fontSize:16, lineHeight:1, color:isRedSuit(s) ? "#c07070" : "#4a4a4a" }}>{s}</div>
                  <div style={{ fontSize:9, color:"#aaa", letterSpacing:2, marginTop:6 }}>{n}</div>
                  <div style={{ fontSize:15, color:suitCnt[i] ? "#2c2c2c" : "#bbb", fontWeight:500, marginTop:2 }}>{suitCnt[i]}</div>
                </div>
              ))}
            </div>

            {/* 逐張牌義 */}
            <div style={{ background:"var(--paper)", borderRadius:12, border:"1px solid var(--line)", boxShadow:"0 1px 8px rgba(0,0,0,0.04)", padding:"4px 18px", marginBottom:16 }}>
              {result.cards.map((c, i) => (
                <div key={i} style={{ display:"flex", gap:14, padding:"16px 0", borderTop:i ? "1px solid #f3efe8" : "none", animation:`slideUp 0.5s ease ${i * 0.08}s both` }}>
                  <div style={{ width:42, height:42, flexShrink:0, borderRadius:"50%", background:"#faf8f5", border:"1px solid #d4b896", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{c.ic}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:9.5, color:"#aaa", letterSpacing:2, marginBottom:3 }}>第{POS_CN[i]}張</div>
                    <div style={{ display:"flex", alignItems:"baseline", flexWrap:"wrap", gap:"0 8px" }}>
                      <span style={{ fontSize:15, fontWeight:500, color:"#2c2c2c", letterSpacing:2 }}>
                        <span style={{ color:isRedSuit(c.suit) ? "#c07070" : "#4a4a4a", marginRight:5, fontSize:13 }}>{c.suit}</span>{c.name}
                      </span>
                      <span className="it" style={{ fontSize:13, fontStyle:"italic", color:"#6b8f71" }}>{c.it}</span>
                    </div>
                    <p style={{ fontSize:12.5, color:"#555", lineHeight:1.9, marginTop:5 }}>{c.mean}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* 總結 */}
            <div style={{ background:"var(--paper)", borderRadius:12, padding:"18px 18px 18px 16px", marginBottom:16, borderLeft:"3px solid #b8956a", boxShadow:"0 1px 8px rgba(0,0,0,0.04)" }}>
              <div className="it" style={{ fontSize:12, color:"#b8956a", letterSpacing:3, fontStyle:"italic", marginBottom:8 }}>Sintesi</div>
              <p style={{ fontSize:13, color:"#444", lineHeight:2 }}>{result.summary}</p>
            </div>

            {/* 花色說明 */}
            <button onClick={() => setShowDetail(!showDetail)} style={{ width:"100%", padding:"16px 18px", background:"var(--paper)", border:"1px solid #eae6df", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:showDetail?0:16, borderBottomLeftRadius:showDetail?0:10, borderBottomRightRadius:showDetail?0:10, boxShadow:"0 1px 4px rgba(0,0,0,0.03)" }}>
              <span style={{ fontSize:12, color:"#888", letterSpacing:2 }}>四 種 花 色 的 意 義</span>
              <span style={{ fontSize:11, color:"#aaa", transition:"transform 0.3s", transform:showDetail?"rotate(180deg)":"rotate(0deg)" }}>▼</span>
            </button>
            {showDetail && (
              <div style={{ background:"var(--paper)", borderTop:"1px dashed #eae6df", borderLeft:"1px solid #eae6df", borderRight:"1px solid #eae6df", borderBottom:"1px solid #eae6df", borderBottomLeftRadius:10, borderBottomRightRadius:10, padding:"6px 18px", marginBottom:16, animation:"sd 0.3s ease" }}>
                {SUIT_INFO.map(([s, n, d], i) => (
                  <div key={s} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0", borderTop:i ? "1px solid #f3efe8" : "none", fontSize:12 }}>
                    <span style={{ width:16, textAlign:"center", color:isRedSuit(s) ? "#c07070" : "#4a4a4a" }}>{s}</span>
                    <span style={{ width:34, color:"#4a6b4e", fontWeight:500 }}>{n}</span>
                    <span style={{ color:"#666" }}>{d}</span>
                  </div>
                ))}
              </div>
            )}

            <p style={{ fontSize:10, color:"#aaa", textAlign:"center", lineHeight:1.9, marginBottom:24, letterSpacing:0.5 }}>
              牌義整理自傳統西比拉卡的常見解讀，花色分組為簡化設計。<br/>結果僅供娛樂與自我反思。
            </p>
          </div>
        ) : result.cards ? (
          <div>
            <div style={{ textAlign:"center", marginBottom:24 }}><span className="qchip">{result.question}</span></div>
            <div className="panel" style={{ padding:"4px 18px", marginBottom:16 }}>
              {result.cards.map((c, i) => {
                const tarot = result.system === "tarot";
                const mi = tarot ? TAROT_MAJOR.indexOf(c.name) : -1;
                const parts = tarot ? null : c.name.split(" ");
                return (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:14, padding:"15px 0", borderTop:i ? "1px solid var(--line2)" : "none", animation:`slideUp 0.5s ease ${i * 0.08}s both` }}>
                    <div className="it" style={{ width:44, height:44, flexShrink:0, borderRadius:"50%", background:"#faf8f5", border:"1px solid var(--gold-l)", display:"flex", alignItems:"center", justifyContent:"center", color:tarot && mi < 0 ? "var(--sage)" : "var(--gold)", fontSize:tarot ? (mi >= 0 ? 16 : 10.5) : 19, fontStyle:tarot && mi < 0 ? "italic" : "normal" }}>
                      {tarot ? (mi >= 0 ? ROMAN[mi] : TAROT_SUIT_IT[c.name.slice(0, 2)]) : parts[0]}
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:9.5, color:"var(--faint)", letterSpacing:2, marginBottom:3 }}>
                        第{POS_CN[i]}張{mi >= 0 && <span style={{ color:"var(--gold)", marginLeft:8 }}>大秘儀</span>}
                      </div>
                      <div style={{ fontSize:15.5, fontWeight:500, letterSpacing:2 }}>{tarot ? c.name : parts.slice(1).join(" ")}</div>
                    </div>
                    {tarot && (
                      <span style={{ fontSize:11, letterSpacing:2, padding:"3px 10px", borderRadius:10, flexShrink:0, color:c.rev ? "var(--rose)" : "var(--sage-d)", background:c.rev ? "#f8ecec" : "var(--sage-l)" }}>
                        {c.rev ? "逆位" : "正位"}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
            <p className="note">可複製牌面結果，留存或交由占卜師進一步解讀。</p>
          </div>
        ) : (
          <div className="panel" style={{ padding:22, marginBottom:22, whiteSpace:"pre-wrap", fontSize:12, lineHeight:1.95, color:"var(--ink2)" }}>{copyText}</div>
        )}

      <div style={{ display:"flex", gap:10 }}>
        <PBtn onClick={copy} style={{ flex:1 }}>{cp === "ok" ? "Copiato ✓" : cp === "fail" ? "請長按手動複製" : "Copia"}</PBtn>
        <GBtn onClick={onRestart} style={{ flex:1 }}>Di Nuovo</GBtn>
      </div>
    </div>
  </>);
}

/* ═══ APP ═══ */
function App() {
  const [pg, setPg] = useState("q");
  const [q, setQ] = useState("");
  const [sys, setSys] = useState(null);
  const [cnt, setCnt] = useState(3);
  const [res, setRes] = useState(null);
  useEffect(() => { window.scrollTo(0, 0); }, [pg]);
  return (<>
    <style>{G}</style>
    <Backdrop />
    <div className="shell"><div className="col">
      {pg === "q" && <PageQ onNext={v => { setQ(v); setPg("s"); }} />}
      {pg === "s" && <PageS question={q} onNext={(s, c) => { setSys(s); setCnt(c); setPg("d"); }} onBack={() => setPg("q")} />}
      {pg === "d" && sys === "liuyao" && <PageY question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
      {pg === "d" && sys !== "liuyao" && <PageC system={sys} cnt={cnt} question={q} onResult={r => { setRes(r); setPg("r"); }} onBack={() => setPg("s")} />}
      {pg === "r" && res && <PageR result={res} onRestart={() => { setPg("q"); setQ(""); setSys(null); setRes(null); }} />}
    </div></div>
  </>);
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e) {
  document.getElementById("root").innerHTML = '<pre style="padding:20px;color:red;font-size:12px;white-space:pre-wrap">React 渲染錯誤：' + e.message + '</pre>';
}
</script>
</body>
